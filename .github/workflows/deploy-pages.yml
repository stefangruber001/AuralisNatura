name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish ONLY the public website. The private handover/ (business plan,
      # financials, AI prompts) is deliberately excluded so it is never exposed
      # via the public Pages site, even though the repo is private.
      - name: Assemble public site
        run: |
          rm -rf _site
          mkdir -p _site
          echo "www.auralisnatura.com" > _site/CNAME
          cp index.html _site/
          cp impressum.html _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp llms.txt _site/
          # strip HTML comments from published pages (smaller HTML; source stays readable)
          python3 -c "import re; d={p:re.sub(r'<!--.*?-->','',open(p,encoding='utf-8').read(),flags=re.S) for p in ('_site/index.html','_site/impressum.html')}; [open(p,'w',encoding='utf-8').write(s) for p,s in d.items()]"
          if [ -d images ]; then cp -r images _site/; fi
          # drop the placeholder so it isn't published
          rm -f _site/images/test.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
