name: Print checks

on:
  pull_request:
    paths: ['design/**', 'ci/**']
  push:
    branches: [main]

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ci/package.json

      - name: Install
        working-directory: ci
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Drop --warn-dpi once the low-res seal and the remote portrait are replaced.
      - name: Geometry, type, asset and content checks
        working-directory: ci
        run: node check-print.mjs ../design --warn-dpi

      - name: Machine-readable report
        if: always()
        working-directory: ci
        run: node check-print.mjs ../design --warn-dpi --json > report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-check-report
          path: ci/report.json

  proof-pdf:
    runs-on: ubuntu-latest
    needs: geometry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install
        working-directory: ci
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Press-ready proof for every commit. Scale 1 and preferCSSPageSize are
      # mandatory: any "fit to page" scaling destroys the trim geometry.
      - name: Render proof PDF
        working-directory: ci
        run: |
          node --input-type=module -e "
          import { chromium } from '@playwright/test';
          import { createServer } from 'node:http';
          import { readFile } from 'node:fs/promises';
          import { join, extname } from 'node:path';
          const MIME={'.html':'text/html','.js':'text/javascript','.css':'text/css','.png':'image/png','.jpg':'image/jpeg','.woff2':'font/woff2'};
          const srv=createServer(async(q,s)=>{try{const p=join('../design',decodeURIComponent(new URL(q.url,'http://x').pathname));
            const b=await readFile(p);s.writeHead(200,{'content-type':MIME[extname(p)]??'application/octet-stream'});s.end(b);}catch{s.writeHead(404).end();}});
          await new Promise(r=>srv.listen(0,r));
          const br=await chromium.launch();const pg=await br.newPage();
          await pg.goto('http://127.0.0.1:'+srv.address().port+'/'+encodeURIComponent('Auralis Natura Flyers A5 - A6.dc.html'),{waitUntil:'networkidle'});
          await pg.waitForTimeout(2500);
          await pg.pdf({path:'proof.pdf',preferCSSPageSize:true,printBackground:true,scale:1});
          await br.close();srv.close();
          "

      - uses: actions/upload-artifact@v4
        with:
          name: proof-pdf
          path: ci/proof.pdf
