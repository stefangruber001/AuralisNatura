<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Auralis Natura — Betriebskonsole</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,360..600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2A211A;--ink-soft:#5C4A3A;--ink-faint:#8C7E6E;--forest:#3D2719;--forest-deep:#27170E;--clay:#A8492A;--gold:#AD7A32;--sage:#927B4A;--sage-soft:#DAC79E;--paper:#F5EEE0;--cream:#FBF6EB;--line:rgba(61,39,25,.16);--line2:rgba(61,39,25,.28);--fd:"Fraunces",Georgia,serif;--fb:"Hanken Grotesk",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header img{width:34px;height:34px}header b{font-family:var(--fd);font-weight:430;font-size:1.15rem}
header .sp{flex:1}
.kpis{display:flex;gap:10px}.kpi{background:#fff;border:1px solid var(--line);padding:6px 12px;text-align:center;min-width:76px}
.kpi .n{font-family:var(--fd);font-size:1.3rem;color:var(--forest)}.kpi .l{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:0;height:calc(100vh - 63px)}
.list{border-right:1px solid var(--line);overflow:auto;background:var(--cream)}
.list .top{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.cl{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.cl:hover{background:#fff}.cl.on{background:#fff;box-shadow:inset 3px 0 0 var(--clay)}
.cl .n{font-weight:600}.cl .m{font-size:.78rem;color:var(--ink-faint);display:flex;justify-content:space-between;margin-top:2px}
.badge{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border:1px solid var(--line2);color:var(--ink-soft)}
.badge.draft,.badge.review{background:var(--gold);color:#2A2210;border-color:var(--gold)}
.badge.sent,.badge.done{background:var(--sage);color:#fff;border-color:var(--sage)}
.detail{overflow:auto;padding:24px 30px}
.empty{color:var(--ink-faint);text-align:center;margin-top:80px}
h1{font-family:var(--fd);font-weight:400;font-size:1.7rem}
h2{font-family:var(--fd);font-weight:400;font-size:1.15rem;color:var(--forest);margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:.4em;font-family:inherit;font-weight:600;font-size:.8rem;letter-spacing:.03em;padding:.7em 1.2em;border:0;cursor:pointer;background:var(--clay);color:#FBF3EC;border-radius:0}
.btn:hover{background:#9a583a}.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.dark{background:var(--forest)}.btn.sm{padding:.45em .8em;font-size:.72rem}
.btn:disabled{opacity:.45;cursor:default}
input,textarea{width:100%;font-family:inherit;font-size:.9rem;color:var(--ink);background:#fff;border:1px solid var(--line2);padding:.6em .75em;border-radius:0}
textarea{min-height:70px;resize:vertical}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:.88rem;margin:4px 0}
.kv .k{color:var(--ink-faint)}
.card{background:var(--cream);border:1px solid var(--line);padding:16px 18px;margin:10px 0}
.sec{background:#fff;border:1px solid var(--line);padding:12px 14px;margin:8px 0}
.sec .t{font-family:var(--fd);color:var(--forest);margin-bottom:4px}
.flag{background:#f7ddd6;border:1px solid var(--clay);border-left:5px solid var(--clay);color:#7a2f18;padding:12px 15px;margin:10px 0;font-size:.9rem;font-weight:600}
.approve-panel{margin-top:14px;padding:14px 16px;background:var(--cream);border:1px solid var(--line);border-top:2px solid var(--forest);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.badge.flagged{background:var(--clay);color:#fff;border-color:var(--clay)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--forest);color:#F6F2E7;padding:11px 20px;font-size:.85rem;opacity:0;transition:.3s;z-index:50}
.toast.on{opacity:1}
.muted{color:#6E6152;font-size:.8rem}.hidden{display:none}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.gate{max-width:420px;margin:12vh auto;background:var(--cream);border:1px solid var(--line);padding:30px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
pre{white-space:pre-wrap;font-family:inherit;font-size:.85rem;color:var(--ink-soft)}
</style></head>
<body>
<!-- KEY GATE -->
<div id="gate" class="gate">
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px"><img src="/assets/seal.png" width="36"><b style="font-family:var(--fd);font-size:1.2rem">Betriebskonsole</b></div>
  <p class="muted" style="margin-bottom:14px">Enter your staff key. In production this page also sits behind Cloudflare Access.</p>
  <input id="key" type="password" placeholder="Staff key" onkeydown="if(event.key==='Enter')unlock()">
  <div style="margin-top:14px"><button class="btn" onclick="unlock()">Unlock</button></div>
  <div id="gateErr" class="err" style="color:var(--clay);font-size:.85rem;margin-top:8px"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">
<header>
  <img src="/assets/seal.png" alt=""><b>Auralis Natura</b><span class="muted">· Betriebskonsole</span>
  <span class="sp"></span>
  <div class="kpis" id="kpis"></div>
  <button class="btn ghost sm" onclick="showTermine()" style="margin-left:10px">📅 Termine</button>
  <button class="btn ghost sm" onclick="showStammdaten()">⚙ Stammdaten</button>
  <button class="btn ghost sm" onclick="showStatus()" title="System status">◍ System</button>
</header>
<div class="wrap">
  <div class="list">
    <div class="top" style="flex-wrap:wrap">
      <button class="btn sm" onclick="invite()">+ Invite</button>
      <button class="btn ghost sm" onclick="loadClients()">↻</button>
      <input id="search" placeholder="Search…" oninput="filterList()" style="flex:1;min-width:110px;font-size:.82rem;padding:.45em .6em">
      <select id="stageFilter" onchange="filterList()" style="font-size:.78rem;padding:.4em">
        <option value="">All stages</option>
        <option>invited</option><option>intake</option><option>prep</option><option>call</option>
        <option>draft</option><option>review</option><option>sent</option><option>done</option>
      </select>
    </div>
    <div id="clients"></div>
  </div>
  <div class="detail" id="detail"><div class="empty">Select a client, or invite a new one.</div></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
let KEY=sessionStorage.getItem('an_staff_key')||'', CUR=null, notesDirty=false, reportDirty=false;
const STAGES=['invited','intake','prep','call','draft','review','sent','done'];
function stageCls(s){return STAGES.includes(s)?s:'';}   // never inject raw into a class attr
function api(path,opts={}){opts.headers=Object.assign({'Content-Type':'application/json','X-Auralis-Key':KEY},opts.headers||{});
  return fetch(path,opts).then(async r=>({ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))}));}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));}
function fail(r,fallback){toast((r&&r.body&&r.body.error)||fallback);}

async function unlock(){ const candidate=$('#key').value.trim(); const prev=KEY; KEY=candidate;
  const r=await api('/api/clients'); if(!r.ok){KEY=prev;$('#gateErr').textContent='That key was not accepted.';return;}
  sessionStorage.setItem('an_staff_key',KEY); $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
  loadClients(); loadKpis(); }
async function boot(){ if(!KEY)return; const r=await api('/api/clients'); if(r.ok){$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');renderList(r.body.clients);loadKpis();} }

async function loadKpis(){ const r=await api('/api/dashboard'); if(!r.ok)return; const d=r.body;
  $('#kpis').innerHTML=[['Clients',d.total_clients],['In draft',d.in_draft],['Sent',d.sent]].map(([l,n])=>`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join(''); }
let ALL_CLIENTS=[];
async function loadClients(){ const r=await api('/api/clients'); if(r.ok){ALL_CLIENTS=r.body.clients;filterList();} }
function filterList(){
  const q=(($('#search')||{}).value||'').toLowerCase().trim();
  const st=(($('#stageFilter')||{}).value||'');
  const cs=ALL_CLIENTS.filter(c=>(!st||c.stage===st) &&
    (!q||[c.name,c.client_id,c.email].some(v=>(v||'').toLowerCase().includes(q))));
  renderList(cs);
}
async function showStatus(){ const r=await api('/api/status'); if(!r.ok){fail(r,'Status unavailable');return;}
  const s=r.body; const yn=v=>v?'✓':'—';
  alert('System status\n\n'
    +'Server: '+s.server+'\n'
    +'Agent provider: '+s.agent_provider+'  (Claude CLI: '+yn(s.claude_cli_available)+')\n'
    +'Email mode: '+s.email_mode+'  (SMTP configured: '+yn(s.smtp_configured)+')\n'
    +'PDF renderer (Chrome): '+yn(s.chrome_available)+'\n'
    +'Backups configured: '+yn(s.backup_dir_set)+'\n'
    +'Production mode: '+yn(s.production)+'\n'
    +'Booking link: '+(s.booking_url||'—')); }
async function preview(cid){
  const secs=[...$$('[data-si]')].map(t=>({key:t.getAttribute('data-key'),title:t.getAttribute('data-title'),body:t.value}));
  const r=await fetch('/api/client/'+cid+'/preview',{method:'POST',headers:{'Content-Type':'application/json','X-Auralis-Key':KEY},body:JSON.stringify({sections:secs})});
  if(!r.ok){toast('Preview failed');return;}
  const w=window.open('','_blank'); w.document.write(await r.text()); w.document.close();
}
function renderList(cs){ $('#clients').innerHTML = cs.length?cs.map(c=>
  `<div class="cl ${CUR===c.client_id?'on':''}" onclick="open_('${esc(c.client_id)}')"><div class="n">${esc(c.name)}</div>
   <div class="m"><span>${esc(c.client_id)}</span><span class="badge ${stageCls(c.stage)}">${esc(c.stage)}</span></div></div>`).join('')
  : '<div class="muted" style="padding:16px">No clients yet.</div>'; }

async function open_(cid){ CUR=cid; loadClients();
  const r=await api('/api/client/'+cid); if(!r.ok){toast('Could not load');return;}
  renderDetail(r.body.client,r.body.record); }

function renderDetail(cl,rec){
  const intake=rec.intake||{}; const rep=rec.report;
  const flag = rep&&rep.red_flag ? `<div class="flag">⚠ Red flag detected — the draft opens with a doctor referral. Review carefully.</div>` : '';
  const cid=cl.client_id;
  let h=`<div class="row" style="justify-content:space-between"><h1>${esc(cl.name)}</h1>
    <div class="row"><span class="badge ${stageCls(rec.stage)}">${esc(rec.stage)}</span>
    <button class="btn ghost sm" onclick="gdprExport('${esc(cid)}')">Export</button>
    <button class="btn ghost sm" onclick="erase('${esc(cid)}')">Erase</button></div></div>
    <div class="muted">${esc(cid)} · ${esc(cl.email)} · ${esc(cl.language)}</div>${flag}`;

  // intake
  h+=`<h2>Intake</h2>`;
  if(!rec.intake){ h+=`<p class="muted">Not submitted yet. <button class="btn ghost sm" onclick="resetPw('${esc(cl.client_id)}')">Reset password</button></p>`; }
  else{
    const scales=(intake.b)?Object.entries(intake.b).map(([k,v])=>`${k} ${v}/5`).join(' · '):'—';
    h+=`<div class="card">
      <div class="kv"><span class="k">Goal</span><span>${esc(intake.goal)}</span></div>
      <div class="kv"><span class="k">Why now</span><span>${esc(intake.why_now)}</span></div>
      <div class="kv"><span class="k">Tried</span><span>${esc(intake.tried)}</span></div>
      <div class="kv"><span class="k">Self-ratings</span><span>${esc(scales)}</span></div>
      <div class="kv"><span class="k">Symptoms</span><span>${esc(intake.symptoms)}</span></div>
      <div class="kv"><span class="k">Life stage</span><span>${esc(intake.life_stage)}</span></div>
      <div class="kv"><span class="k">Medications</span><span>${esc(intake.medications)}</span></div>
      <div class="kv"><span class="k">Red-flag ticks</span><span>${esc((intake.red_flags||[]).join(', '))}</span></div>
    </div>`;
    // prep
    h+=`<h2>Meeting prep <button class="btn ghost sm" onclick="prep('${esc(cid)}')">Regenerate</button></h2><pre class="card">${esc(rec.prep||'—')}</pre>`;
    // notes
    h+=`<h2>Your call notes</h2><textarea id="notes" oninput="notesDirty=true">${esc(rec.notes||'')}</textarea>
        <div style="margin-top:8px"><button class="btn dark sm" onclick="saveNotes('${esc(cid)}')">Save notes</button></div>`;
    // draft
    h+=`<h2>Report draft <span class="muted">${rep?('· '+esc(rep.provider||'')):''}</span></h2>`;
    if(!rep){ h+=`<p><button class="btn" onclick="draft('${esc(cid)}')">Draft report with the agent →</button></p>`; }
    else{
      h+=rep.sections.map((s,i)=>`<div class="sec"><div class="t">${esc(s.title)}</div>
        <textarea data-si="${i}" data-key="${esc(s.key)}" data-title="${esc(s.title)}" oninput="reportDirty=true">${esc(s.body)}</textarea></div>`).join('');
      h+=`<div class="row" style="margin-top:10px">
        <button class="btn ghost sm" onclick="draft('${esc(cid)}')">Re-draft</button>
        <button class="btn ghost sm" onclick="preview('${esc(cid)}')">👁 Preview</button>
        <button class="btn dark sm" onclick="saveReport('${esc(cid)}')">Save edits</button>
      </div>
      <div class="approve-panel">
        <label class="row" style="gap:8px;font-size:.9rem;font-weight:600"><input type="checkbox" id="approve" onchange="$('#genBtn').disabled=!this.checked" style="width:auto;transform:scale(1.2)" ${rep.approved?'checked':''}> I have reviewed &amp; approve this report</label>
        <button class="btn" id="genBtn" onclick="generate('${esc(cid)}')" ${rep.approved?'':'disabled'}>✓ Generate report + email draft</button>
        ${rec.stage==='sent'||rec.stage==='done'?`<a class="btn ghost sm" href="#" onclick="dl(event,'${esc(cid)}')">Download PDF</a>`:''}
        <div class="muted" style="margin-top:6px;flex-basis:100%">Preview shows the real PDF before you send. Generate unlocks only once approved — nothing is sent, it lands in your Gmail drafts to review &amp; send.</div>
      </div>`;
    }
    // activity log
    const acts=(rec.meta&&rec.meta.activity)||[];
    if(acts.length){ h+=`<h2>Activity</h2><div class="card" style="font-size:.8rem;color:var(--ink-soft)">`+
      acts.slice().reverse().map(a=>`<div class="row" style="justify-content:space-between"><span>${esc(a.event)}</span><span class="muted">${esc((a.ts||'').replace('T',' ').slice(0,16))}</span></div>`).join('')+`</div>`; }
  }
  $('#detail').innerHTML=h;
}

// guard against silently discarding unsaved report edits when a re-render is about to happen
async function guardDirty(cid){                    // auto-save any unsaved edits before a re-render
  if(notesDirty && $('#notes')!=null){ await saveNotes(cid); }
  if(reportDirty && $('#approve')!=null){ await saveReport(cid); }
}
async function invite(){ const name=(prompt('Client name:')||'').trim(); if(!name)return;
  const email=(prompt('Client email:')||'').trim(); if(!email||!email.includes('@')){toast('A valid email is required');return;}
  let lang=(prompt('Language (de/en/es):','de')||'de').trim(); if(!['de','en','es'].includes(lang))lang='de';
  const r=await api('/api/clients',{method:'POST',body:JSON.stringify({name,email,language:lang})});
  if(!r.ok){fail(r,'Invite failed');return;}
  loadClients(); loadKpis();
  alert('Invited '+r.body.client_id+'\nPassword: '+r.body.password+'\nPortal: '+r.body.portal_url+'\n\nSend these to the client securely.'); }
async function resetPw(cid){ const r=await api('/api/client/'+cid+'/reset-password',{method:'POST'}); r.ok?alert('New password: '+r.body.password):fail(r,'Reset failed'); }
async function prep(cid){ await guardDirty(cid); const r=await api('/api/client/'+cid+'/prep',{method:'POST'}); if(r.ok){toast('Prep updated');open_(cid);}else fail(r,'Prep failed'); }
async function saveNotes(cid){ const notes=$('#notes').value; const r=await api('/api/client/'+cid+'/notes',{method:'POST',body:JSON.stringify({notes})}); if(r.ok){toast('Notes saved');notesDirty=false;loadClients();}else fail(r,'Could not save notes'); }
async function draft(cid){ await guardDirty(cid); toast('Agent drafting…'); const r=await api('/api/client/'+cid+'/draft',{method:'POST'}); if(r.ok){toast('Draft ready');open_(cid);}else fail(r,'Draft failed'); }
async function saveReport(cid,approved){
  const secs=[...$$('[data-si]')].map(t=>({key:t.getAttribute('data-key'),title:t.getAttribute('data-title'),body:t.value}));
  const ap = approved!=null ? approved : (($('#approve')||{}).checked||false);
  const r=await api('/api/client/'+cid+'/report/save',{method:'POST',body:JSON.stringify({sections:secs,approved:ap})});
  r.ok ? (toast(ap?'Saved & approved':'Edits saved'), reportDirty=false) : fail(r,'Could not save the report');
  return r; }
async function generate(cid){
  const ap = (($('#approve')||{}).checked||false);
  const sr=await saveReport(cid,ap);
  if(!sr.ok){return;}                       // don't generate on a failed save
  if(!ap){toast('Tick “Approved” first');return;}
  toast('Rendering + drafting email…');
  const r=await api('/api/client/'+cid+'/generate',{method:'POST'});
  if(!r.ok){fail(r,'Generate failed');return;}
  const dv=r.body.delivery||{};
  toast('Report generated · '+(dv.draft||dv.mode||'saved'));
  open_(cid); loadClients(); loadKpis(); }
function saveBlob(b,name){ const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000); }
async function dl(e,cid){ e.preventDefault();
  const r=await fetch('/api/client/'+cid+'/report.pdf',{headers:{'X-Auralis-Key':KEY}});
  if(!r.ok){toast('Report file not found');return;}
  saveBlob(await r.blob(),'Auralis-Report-'+cid+'.pdf'); }
async function gdprExport(cid){ const r=await api('/api/client/'+cid+'/gdpr-export');
  if(!r.ok){fail(r,'Export failed');return;}
  saveBlob(new Blob([JSON.stringify(r.body,null,2)],{type:'application/json'}), cid+'-gdpr-export.json'); }
async function erase(cid){ if(!confirm('Permanently erase ALL data for '+cid+' (intake, notes, report PDF, emails)? This cannot be undone.'))return;
  const r=await api('/api/client/'+cid,{method:'DELETE'}); if(r.ok){toast('Erased');CUR=null;$('#detail').innerHTML='<div class="empty">Erased.</div>';loadClients();loadKpis();}else fail(r,'Erase failed'); }

// ---------- Termine (availability + bookings) ----------
async function showTermine(){
  CUR=null; loadClients();
  const [av,bk]=await Promise.all([api('/api/availability'),api('/api/bookings')]);
  if(!av.ok){fail(av,'Could not load availability');return;}
  const a=av.body, days=['mon','tue','wed','thu','fri','sat','sun'],
        names={mon:'Montag',tue:'Dienstag',wed:'Mittwoch',thu:'Donnerstag',fri:'Freitag',sat:'Samstag',sun:'Sonntag'};
  let h=`<h1>Termine</h1><div class="muted">Own-brand booking page: <a href="/book" target="_blank">/book</a> · times in ${esc(a.timezone)}</div>`;
  h+=`<h2>Verfügbarkeit</h2><div class="card">`;
  h+=days.map(d=>`<div class="kv"><span class="k">${names[d]}</span>
      <input data-av="${d}" value="${esc((a.windows[d]||[]).join(', '))}" placeholder="e.g. 09:30-12:00, 14:00-17:00"></div>`).join('');
  h+=`<div class="kv"><span class="k">Slot (min)</span><input data-avn="slot_minutes" value="${a.slot_minutes}"></div>
      <div class="kv"><span class="k">Puffer (min)</span><input data-avn="buffer_minutes" value="${a.buffer_minutes}"></div>
      <div class="kv"><span class="k">Vorlauf (h)</span><input data-avn="lead_hours" value="${a.lead_hours}"></div>
      <div class="kv"><span class="k">Horizont (Tage)</span><input data-avn="horizon_days" value="${a.horizon_days}"></div>
      <div class="kv"><span class="k">Max/Tag</span><input data-avn="max_per_day" value="${a.max_per_day}"></div>
      <div class="kv"><span class="k">Blockierte Tage</span><input data-avs="blocked_dates" value="${esc((a.blocked_dates||[]).join(', '))}" placeholder="2026-08-15, 2026-08-16"></div>
      <div style="margin-top:10px"><button class="btn dark sm" onclick="saveAvailability()">Verfügbarkeit speichern</button></div></div>`;
  h+=`<h2>Gebuchte Termine</h2>`;
  const list=(bk.ok&&bk.body.bookings)||[];
  h+= list.length ? `<div class="card">`+list.map(b=>{
      const d=new Date(b.start_utc);
      const when=d.toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:a.timezone});
      return `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0">
        <span><b>${esc(when)}</b> · ${esc(b.name)} <span class="muted">${esc(b.email)} · ${esc(b.language)}</span>${b.note?('<br><span class="muted">„'+esc(b.note)+'“</span>'):''}</span>
        <span>${b.status==='confirmed'?`<button class="btn ghost sm" onclick="cancelBooking('${esc(b.id)}')">Stornieren</button>`:`<span class="badge">${esc(b.status)}</span>`}</span></div>`;
    }).join('')+`</div>` : `<p class="muted">Noch keine Buchungen.</p>`;
  $('#detail').innerHTML=h;
}
async function saveAvailability(){
  const windows={}; $$('[data-av]').forEach(i=>{windows[i.dataset.av]=i.value.split(',').map(x=>x.trim()).filter(Boolean);});
  const body={windows};
  $$('[data-avn]').forEach(i=>{body[i.dataset.avn]=parseInt(i.value)||0;});
  const bd=$('[data-avs="blocked_dates"]'); if(bd)body.blocked_dates=bd.value.split(',').map(x=>x.trim()).filter(Boolean);
  const r=await api('/api/availability',{method:'POST',body:JSON.stringify(body)});
  r.ok?toast('Verfügbarkeit gespeichert'):fail(r,'Speichern fehlgeschlagen');
}
async function cancelBooking(id){ if(!confirm('Diesen Termin stornieren?'))return;
  const r=await api('/api/booking/'+id+'/cancel',{method:'POST'});
  r.ok?(toast('Storniert'),showTermine()):fail(r,'Stornieren fehlgeschlagen'); }

// ---------- Stammdaten (company master data) ----------
const SD_FIELDS=[["legal_name","Firmenname"],["owner","Inhaberin"],["nif","NIF / Steuernummer"],
  ["address_lines","Adresse (Zeilen mit ; trennen)"],["email","E-Mail"],["phone","Telefon"],
  ["web","Website"],["instagram","Instagram"],["meet_link","Google-Meet-Link (für Buchungen)"],
  ["vat_rate","IVA-Satz (z. B. 0.21)"],["vat_note","IVA-Hinweis"]];
async function showStammdaten(){
  CUR=null; loadClients();
  const r=await api('/api/company'); if(!r.ok){fail(r,'Could not load Stammdaten');return;}
  const co=r.body;
  let h=`<h1>Stammdaten</h1><div class="muted">Erscheinen auf Berichten, E-Mails und Rechnungen. NIF & Adresse vor der ersten echten Rechnung ausfüllen.</div><div class="card" style="margin-top:12px">`;
  h+=SD_FIELDS.map(([k,label])=>{
    let v=co[k]; if(Array.isArray(v))v=v.join('; '); if(v==null)v='';
    return `<div class="kv"><span class="k">${label}</span><input data-sd="${k}" value="${esc(String(v))}"></div>`;}).join('');
  const bank=co.bank||{};
  h+=`<div class="kv"><span class="k">Bank</span><input data-sdb="name" value="${esc(bank.name||'')}"></div>
      <div class="kv"><span class="k">IBAN</span><input data-sdb="iban" value="${esc(bank.iban||'')}"></div>
      <div class="kv"><span class="k">BIC</span><input data-sdb="bic" value="${esc(bank.bic||'')}"></div>
      <div style="margin-top:10px"><button class="btn dark sm" onclick="saveStammdaten()">Stammdaten speichern</button></div></div>`;
  $('#detail').innerHTML=h;
}
async function saveStammdaten(){
  const body={}; $$('[data-sd]').forEach(i=>{ let v=i.value.trim();
    if(i.dataset.sd==='address_lines')v=v.split(';').map(x=>x.trim()).filter(Boolean);
    if(i.dataset.sd==='vat_rate')v=parseFloat(v)||0;
    body[i.dataset.sd]=v; });
  const bank={}; $$('[data-sdb]').forEach(i=>bank[i.dataset.sdb]=i.value.trim());
  bank.account_holder='Desiree Gruber'; body.bank=bank;
  const r=await api('/api/company',{method:'POST',body:JSON.stringify(body)});
  r.ok?toast('Stammdaten gespeichert'):fail(r,'Speichern fehlgeschlagen');
}
boot();
</script>
