/* ───────── Anfrage-Detail (Seitenpanel) ─────────
   Ein Klick auf eine Journey-Zeile öffnet rechts die strukturierte Ansicht —
   Kontakt, Eckdaten, dann die Journey-Abschnitte 01…05, Dokumente, Aktivität.
   Konzeptvorbild ist die Paramur-Detailansicht; Sprache und Gestalt sind
   vollständig Auralis (eckig, Hairlines, Fraunces, ein Clay-Hauptknopf). */
let DRAWER_CID=null;
function closeDrawer(){ DRAWER_CID=null; document.documentElement.classList.remove('dw-open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&DRAWER_CID)closeDrawer(); });
const SCALE_DE={energy:'Energie',sleep:'Schlaf',stress:'Stressbalance',digestion:'Verdauung'};
/* Fünf Quadrate, Farbe nach Leserichtung „höher = besser": 1–2 Clay · 3 Sage ·
   4–5 Pine — dieselbe Semantik wie in /book, Portal, App und Bericht. */
function sqScale(v){ v=Math.max(0,Math.min(5,+v||0));
  const cls=v<=2?'clay':(v===3?'sage':'ok'); let h='';
  for(let i=1;i<=5;i++)h+=`<i class="sq ${i<=v?cls:''}"></i>`;
  return `<span class="sqrow">${h}<b class="num">${v}/5</b></span>`; }
function dwScales(obj){ const ord=['energy','sleep','stress','digestion'];
  return Object.entries(obj||{}).sort((a,b)=>ord.indexOf(a[0])-ord.indexOf(b[0])).map(([k,v])=>
  `<div class="dw-scale"><span class="sl">${esc(SCALE_DE[k]||k)}</span>${sqScale(v)}</div>`).join(''); }
/* dieselben Skalen als eine Zeile — deutsche Namen, kanonische Reihenfolge,
   nie wieder rohes "digestion 5/5 · energy 2/5" in der Vollansicht */
function scaleLine(obj){ const ord=['energy','sleep','stress','digestion'];
  return Object.entries(obj||{}).sort((a,b)=>ord.indexOf(a[0])-ord.indexOf(b[0]))
    .map(([k,v])=>`${SCALE_DE[k]||k} ${v}/5`).join(' · '); }
/* Termin-Zeile: das Datum steht als Text; der Ampel-Chip kommt nur dazu, wenn
   er etwas SAGT (überfällig / in < 24 h) — sonst stünde dasselbe Datum zweimal. */
function dwTerm(label,iso,extra){ const h=(new Date(iso)-Date.now())/36e5;
  return `<div class="dw-term ${h<0?'past':''}"><span>${label}${extra||''}</span>
    <span class="num">${dt(iso)}${h>=0&&h<24?' '+ampelChip(iso):''}</span></div>`; }
function dwSec(num,title,count,body,empty){
  return `<div class="dw-sec">${num?`<span class="n num">${num}</span>`:''}<span>${esc(title)}</span>${count?`<span class="ct num">${count}</span>`:''}</div>`
    +(body||`<div class="dw-empty">${empty}</div>`); }
function dwKV(rows){ const r=rows.filter(x=>x&&x[1]);
  return r.length?`<div class="dw-kv">${r.map(([k,v])=>`<span class="k">${esc(k)}</span><span>${v}</span>`).join('')}</div>`:''; }

async function openDrawer(cid,silent){
  DRAWER_CID=cid;
  document.documentElement.classList.add('dw-open');
  const el=$('#drawer');
  const keep=silent?($('#drawer .dw-body')||{}).scrollTop||0:0;
  if(!silent)el.innerHTML=`<div class="dw-head"><div class="dw-kick">Anfrage-Detail</div>
    <div class="dw-title">Lade …</div><button class="dw-x" onclick="closeDrawer()" aria-label="Schließen">×</button></div><div class="dw-body"></div>`;
  const [r,rd,rs]=await Promise.all([api('/api/client/'+cid),
    api('/api/client/'+cid+'/documents'),api('/api/client/'+cid+'/sessions')]);
  if(DRAWER_CID!==cid)return;                 // inzwischen geschlossen/gewechselt
  if(!r.ok){toast('Konnte nicht laden');closeDrawer();return;}
  renderDrawer(r.body.client,r.body.record,(rd.body&&rd.body.items)||[],(rs.body&&rs.body.sessions)||[]);
  const bd=$('#drawer .dw-body'); if(bd)bd.scrollTop=keep;
}
function renderDrawer(cl,rec,docs,sessions){
  const cid=cl.client_id, st=rec.stage||'invited', pkg=rec.package||{};
  const pre=rec.pre_intake||null, intake=rec.intake||null, rep=rec.report||null;
  const row=ALL_CLIENTS.find(c=>c.client_id===cid)
    ||{client_id:cid,stage:st,price:pkg.price,paid:rec.paid,package:pkg.key,package_name:pkg.name};
  const enq=['lead','call'].includes(st)||!!row.next_call;

  let h=`<div class="dw-head">
    <div class="dw-kick">${enq?'Anfrage-Detail':'Kundinnen-Detail'}</div>
    <div class="dw-title">${esc(cl.name||cid)}</div>
    <div class="dw-sub"><span class="num">${esc(cid)}</span><span class="pill ${stageCls(st)}">${stageDe(st)}</span>
      ${cl.language?`<span>${esc((cl.language||'').toUpperCase())}</span>`:''}${cl.created?`<span>seit ${esc(cl.created)}</span>`:''}</div>
    <button class="dw-x" onclick="closeDrawer()" aria-label="Schließen">×</button></div><div class="dw-body">`;

  /* Kundin & Kontakt — immer gefüllt */
  const addr=[cl.address,[cl.city,cl.country].filter(Boolean).join(', ')].filter(Boolean).map(esc).join('<br>');
  h+=dwSec('','Kundin & Kontakt',null,dwKV([
    ['E-Mail',cl.email?`<a href="mailto:${esc(cl.email)}">${esc(cl.email)}</a>`:''],
    ['Telefon',cl.phone?`<a href="tel:${esc(cl.phone)}">${esc(cl.phone)}</a>`:''],
    ['Login-ID',cl.login_id?`<span class="num">${esc(cl.login_id)}</span>`:''],
    ['Adresse',addr],['Sprache',cl.language?esc((cl.language||'').toUpperCase()):''],
    ['Zuletzt',rec.updated?esc(days(rec.updated)==='heute'?'heute':'vor '+days(rec.updated)):'']]),'');

  /* 01 · Anfrage & Vorab-Angaben */
  const calls=[];
  if(rec.booking&&rec.booking.slot_utc)calls.push({t:rec.booking.slot_utc,l:'Kennenlerngespräch'});
  for(const b of rec.followup_bookings||[])if(b&&b.slot_utc)calls.push({t:b.slot_utc,l:'Kennenlerngespräch · Folge-Anfrage'});
  calls.sort((a,b)=>a.t<b.t?-1:1);
  let b01=calls.map(x=>dwTerm(esc(x.l),x.t)).join('');
  if(pre){
    const flags=(pre.red_flags||[]).filter(f=>f!=='none');
    if(flags.length)b01+=`<div class="dw-flag" style="margin-top:8px">⚠ Red Flags: ${esc(flags.map(f=>FLAG_DE[f]||f).join(', '))}</div>`;
    b01+=dwKV([
      ['Wunsch',pre.goal?esc(pre.goal):''],
      ['Themen',(pre.symptoms||[]).length?pre.symptoms.map(s=>`<span class="pichip">${esc(SYM_DE[s]||s)}</span>`).join(' '):''],
      ['Seit',pre.since?esc({weeks:'einigen Wochen',months:'mehreren Monaten',years:'Jahren'}[pre.since]||pre.since):''],
      ['Schlaf',pre.sleep_hours?esc(SLEEP_DE[pre.sleep_hours]||pre.sleep_hours):''],
      ['Bewegung',pre.movement?esc(MOVE_DE[pre.movement]||pre.movement):''],
      ['Ernährung',(pre.diet||[]).length?pre.diet.map(x=>`<span class="pichip">${esc(DIET_DE[x]||x)}</span>`).join(' '):''],
      ['Koffein & Co.',(pre.stimulants||[]).length?pre.stimulants.map(x=>`<span class="pichip">${esc(STIM_DE[x]||x)}</span>`).join(' '):''],
      ['Bisher versucht',pre.tried?esc(pre.tried):''],
      ['Erkrankungen',pre.conditions?esc(pre.conditions):''],
      ['Medikamente',pre.medications?esc(pre.medications):''],
      ['Allergien',pre.allergies?esc(pre.allergies):'']]);
    if(pre.scales&&Object.keys(pre.scales).length)b01+=`<div style="margin-top:6px">${dwScales(pre.scales)}</div>`;
    if(flags.length===0&&(pre.red_flags||[]).includes('none'))b01+=`<div class="dw-empty" style="font-style:normal">Sicherheitsfragen: keine Auffälligkeiten.</div>`;
  }
  h+=dwSec('01','Anfrage & Vorab-Angaben',calls.length||null,b01,
    'Noch keine Terminanfrage — Vorab-Angaben erscheinen hier mit der ersten Anfrage über die Buchungsseite.');

  /* 02 · Erstgespräch & Notizen */
  const nn=(typeof rec.notes==='object'&&rec.notes)?rec.notes:(rec.notes?{beobachtungen:rec.notes}:{});
  const NOTE_DE={beobachtungen:'👀 Beobachtungen',themen:'🎯 Hauptthemen',prioritaeten:'⭐ Prioritäten',vereinbart:'🤝 Vereinbart'};
  const nb=dwKV(Object.entries(NOTE_DE).map(([k,l])=>[l,nn[k]?esc(nn[k]):'']));
  h+=dwSec('02','Erstgespräch & Notizen',null,nb,
    'Füllt sich mit dem Erstgespräch — die strukturierten Notizen entstehen in der Vollansicht.');

  /* 03 · Programm & Zahlung — Vorkasse: Zahlung ist der Startschuss */
  let b03='';
  if(pkg.key){
    b03+=dwKV([['Programm',`<b>${esc(pkg.name||pkg.key)}</b>`],
      ['Preis',`<span class="num">${eur(pkg.price)}</span>`],
      ['Zahlung',rec.paid?'<span class="paychip ok">✓ bezahlt</span>':'<span class="paychip due">offen · Vorkasse</span>']]);
    const act=(sessions||[]).filter(s=>s.status==='confirmed');
    if(act.length){ b03+=`<div style="margin-top:6px">`+act.map(s=>
      dwTerm(esc(s.label||'Gespräch'),s.start_utc,` <span class="muted">· ${+s.minutes||45} Min.</span>`)).join('')+`</div>`; }
    else b03+=`<div class="dw-empty">Programm-Termine noch nicht geplant — der Vorschlag wartet in der Vollansicht.</div>`;
  }
  h+=dwSec('03','Programm & Zahlung',null,b03,
    'Füllt sich, sobald ein Programm gewählt ist — erst Zahlung, dann Zugang, dann Terminplan.');

  /* 04 · Intake */
  let b04='';
  if(intake){
    const fl=(intake.red_flags||[]).filter(f=>f!=='none');
    if(fl.length)b04+=`<div class="dw-flag">⚠ Red Flags: ${esc(fl.map(f=>FLAG_DE[f]||f).join(', '))}</div>`;
    b04+=dwKV([['Ziel',intake.goal?esc(intake.goal):''],
      ['Warum jetzt',intake.why_now?esc(intake.why_now):''],
      ['Symptome',intake.symptoms?esc(intake.symptoms):''],
      ['Lebensphase',intake.life_stage?esc(intake.life_stage):''],
      ['Medikamente',intake.medications?esc(intake.medications):'']]);
    if(intake.b&&Object.keys(intake.b).length)b04+=`<div style="margin-top:6px">${dwScales(intake.b)}</div>`;
  }
  h+=dwSec('04','Intake (Portal-Fragebogen)',null,b04,
    'Füllt sich, wenn sie nach den Zugangsdaten den Fragebogen im Portal ausfüllt.');

  /* 05 · Bericht */
  let b05='';
  if(rep){
    if(rep.red_flag)b05+=`<div class="dw-flag">⚠ Red Flag erkannt — der Entwurf beginnt mit einem Arzt-Hinweis.</div>`;
    b05+=dwKV([['Stand',esc(['sent','done'].includes(st)?'geliefert':(rep.approved?'freigegeben':'Entwurf — wartet auf deine Prüfung'))],
      ['Sprache',rep.language?esc(String(rep.language).toUpperCase()):''],
      ['Kapitel',(rep.sections||[]).length?String((rep.sections||[]).length):''],
      ['Entwurf von',rep.provider?esc(rep.provider):'']]);
    b05+=`<div style="margin-top:8px"><button class="btn dark sm" onclick="openClient('${esc(cid)}')">Bericht öffnen</button></div>`;
  }
  h+=dwSec('05','Bericht',null,b05,
    'Entsteht nach dem Intake: Entwurf → deine Prüfung → Freigabe → Premium-PDF.');

  /* E-Mails an die Kundin — dieselben Ein-Klick-Mails wie in der Vollansicht */
  const M=(fn,label)=>`<button class="btn ghost sm" onclick="${fn}">${label}</button>`;
  let bm=M(`sendCreds('${esc(cid)}')`,'🔑 Zugangsdaten')
    +M(`remindClient('${esc(cid)}')`,'🔔 Erinnerung')
    +(pkg.key?M(`sessionsNotify('${esc(cid)}')`,'📅 Terminliste'):'')
    +M(`askFeedback('${esc(cid)}')`,'⭐ Feedback')
    +M(`personalMail('${esc(cid)}')`,'✉️ Persönlich …');
  h+=dwSec('','E-Mails an die Kundin',null,
    `<div class="dw-empty" style="font-style:normal;padding-bottom:6px">Premium-Vorlage in ihrer Sprache (${esc((cl.language||'de').toUpperCase())}) · ${mailModeLine()}.</div>
     <div class="row" style="gap:6px;flex-wrap:wrap">${bm}</div>`,'');

  /* Dokumente — wächst die ganze Journey entlang */
  const db=docs.length?docs.map(d=>`<div class="dw-doc" onclick="dlOutbox('${esc(d.file)}')" title="Herunterladen">
      <span class="lb">${esc(d.label)}</span><span class="meta">${esc((d.mtime||'').replace('T',' '))}</span>
      <span class="dw-chip">${esc((d.kind||'').toUpperCase())}</span></div>`).join(''):'';
  h+=dwSec('','Dokumente',docs.length||null,db,
    'Jede E-Mail, Einladung und jeder Bericht zu dieser Kundin landet automatisch hier.');

  /* Aktivität */
  const acts=((rec.meta&&rec.meta.activity)||[]).slice().reverse();
  const ab=acts.length?`<div class="dw-log">`+acts.map(a=>`<div class="row"><span>${esc(a.event)}</span><span class="muted num">${esc((a.ts||'').replace('T',' ').slice(0,16))}</span></div>`).join('')+`</div>`:'';
  h+=dwSec('','Aktivität',acts.length||null,ab,'Noch keine Einträge.');

  h+=`</div><div class="dw-act">${_cjActions(row)}</div>`;
  $('#drawer').innerHTML=h;
}

async function showFinanzen(){
  const r=await api('/api/finanzen'); if(!r.ok){fail(r,'Finanzen nicht verfügbar');return;}

  let h=secHead('03','Plandaten','')+`<p class="muted" style="margin:4px 0 14px">Goldene Felder sind editierbar — Änderungen speichern sofort und fließen direkt in Cockpit &amp; Finanzen. Paketpreise pflegst du unter Stammdaten/Konfiguration.</p><div class="plangrid">`;
  for(const [g,paths] of Object.entries(groups)){
    h+=`<div class="card"><b style="font-family:var(--fd);color:var(--forest)">${g}</b>`;
    h+=paths.map(p=>`<div class="kv" style="margin-top:8px"><span class="k">${esc(PLAN_LABELS[p]||p)}</span>
      <input class="plan-in num" value="${esc(String(planVal(plan,p)??''))}" onchange="savePlan('${p}',this)"></div>`).join('');

async function savePlan(path,input){
  const r=await api('/api/plan',{method:'POST',body:JSON.stringify({path,value:input.value.trim()})});
  r.ok?toast('Gespeichert — fließt in Finanzen ein'):fail(r,'Speichern fehlgeschlagen');
}

let AV=null, OV_SEL=null;
const WD_KEYS=['mon','tue','wed','thu','fri','sat','sun'];
const WD_DE={mon:'Montag',tue:'Dienstag',wed:'Mittwoch',thu:'Donnerstag',fri:'Freitag',sat:'Samstag',sun:'Sonntag'};
// Suggestions come from MONDAY, not from a canned list.
// The old fixed presets (Vormittag/Nachmittag/Abend) proposed times that had
// nothing to do with this practice, and they showed up even on a week where
// nothing was set at all — three white buttons offering hours nobody works.
// Monday is the day that actually gets filled in first, so every other day now
// offers exactly what Monday holds: one tap per slot, nothing to retype.
function sugFor(d){
  if(d==='mon') return [];                       // Monday IS the source
  const mon=AV.windows.mon||[], mine=AV.windows[d]||[];
  return mon.filter(w=>!mine.includes(w));       // only what this day lacks
}
// Windows are compared as "HH:MM-HH:MM", so a plain string sort is chronological.
function sortWin(d){ (AV.windows[d]||[]).sort(); }
// Same idea for a single date: suggest the weekly pattern of that weekday,
// falling back to Monday when the weekday itself is free.
function sugForDate(iso,current){
  const wd=WD_KEYS[(new Date(iso+'T12:00:00').getDay()+6)%7];   // JS Sun=0 -> Mon=0
  const base=(AV.windows[wd]&&AV.windows[wd].length)?AV.windows[wd]:(AV.windows.mon||[]);
  return base.filter(w=>!(current||[]).includes(w));
}
function wchips(list,rmFn){ return list.map((w,i)=>`<span class="wchip num">${w}<b onclick="${rmFn}(${i})" title="Entfernen">✕</b></span>`).join(''); }
function addUI(idp,addFn){ return `<span class="tadd"><input type="time" id="${idp}a" value="09:00"><span>–</span><input type="time" id="${idp}b" value="12:00"><button onclick="${addFn}" title="Zeitfenster hinzufügen">+</button></span>`; }
function renderAvWeek(){
  const box=$('#avWeek'); if(!box||!AV)return;
  box.innerHTML=WD_KEYS.map(d=>{
    const wins=AV.windows[d]||[];
    const sug=sugFor(d).map(w=>`<button class="preset" title="Wie Montag übernehmen" onclick="AV.windows['${d}']=[...(AV.windows['${d}']||[]),'${w}'];sortWin('${d}');renderAvWeek()">+ ${w}</button>`).join('');
    // Monday empty: say so once, on Monday, instead of leaving the operator to
    // guess why the other days offer nothing.
    const hint=(d==='mon'&&!wins.length)
      ? `<span class="muted" style="font-size:.86rem">Zeiten hier eintragen — die übrigen Tage schlagen sie dann zum Antippen vor.</span>` : '';
    const all=(d==='mon'&&wins.length)
      ? `<button class="preset" title="Montag auf alle übrigen Tage übertragen" onclick="copyMonToWeek()">Ganze Woche wie Montag</button>` : '';
    return `<div class="avday"><div class="dn ${wins.length?'':'off'}">${WD_DE[d]}${wins.length?'':' · frei'}</div>
      <div class="wchips">${wchips(wins,`rmWin_${d}`)}${sug}${addUI('t'+d,`addWin('${d}','t${d}')`)}${all}${hint}</div></div>`;
  }).join('');
}
WD_KEYS.forEach(d=>{ window['rmWin_'+d]=i=>{ AV.windows[d].splice(i,1); renderAvWeek(); }; });
function addWin(d,idp){ const a=$('#'+idp+'a').value,b=$('#'+idp+'b').value;
  if(!a||!b||a>=b){toast('Bitte gültiges Zeitfenster wählen (von < bis).');return;}
  AV.windows[d]=[...(AV.windows[d]||[]),a+'-'+b]; sortWin(d); renderAvWeek(); }
// Tue-Sun get Monday's windows in one go. Additive and duplicate-safe, so a day
// that already has its own times keeps them.
function copyMonToWeek(){
  const mon=AV.windows.mon||[]; if(!mon.length){toast('Montag ist noch leer.');return;}
  let n=0;
  WD_KEYS.filter(d=>d!=='mon').forEach(d=>{
    const mine=AV.windows[d]||[];
    mon.forEach(w=>{ if(!mine.includes(w)){ mine.push(w); n++; } });
    AV.windows[d]=mine; sortWin(d);
  });
  renderAvWeek(); toast(n?`${n} Zeitfenster übernommen — noch nicht gespeichert.`:'Alle Tage haben Montags Zeiten bereits.');
}

/* The mp4 is built on the server in the background — it takes minutes. Poll
   until it lands so the file simply appears, rather than leaving Desiree to
   guess whether it worked. */
async function socPollReel(sid){
  const card=document.querySelector(`[data-slot="${sid}"]`);
  const host=card&&card.querySelector('.assets');
  if(host&&!host.querySelector('.reelwait')){
    const n=document.createElement('div');
    n.className='reelwait'; n.style.cssText='font-size:.8rem;color:var(--ink-faint);padding:4px 0';
    n.textContent='🎬 Reel wird erzeugt — das dauert einige Minuten …';
    host.appendChild(n);
  }
  for(let i=0;i<90;i++){                       // ~7.5 min, then stop asking
    await new Promise(r=>setTimeout(r,5000));
    const a=await api('/api/social/week/'+SOCPLAN.week+'/assets/'+sid);
    if(!a.ok)break;
    if(!a.body.reel_building){
      socLoadAssets(sid);
      toast((a.body.files||[]).some(f=>f.endsWith('.mp4'))?'Reel fertig':'Reel konnte nicht erzeugt werden');
      return;
    }
  }
  const w=card&&card.querySelector('.reelwait'); if(w)w.remove();
}

    fetch('/api/social/week/'+SOCPLAN.week+'/asset/'+sid+'/'+img.dataset.asset,{headers:{'X-Auralis-Key':KEY}})

const SD_FIELDS=[["legal_name","Firmenname"],["owner","Inhaberin"],["nif","NIF / Steuernummer"],

async function showStammdaten(){
  const r=await api('/api/company'); if(!r.ok){fail(r,'Stammdaten nicht ladbar');return;}
  const co=r.body;
  let h=`<h1>Stammdaten</h1><div class="muted">Erscheinen auf Berichten, E-Mails und Rechnungen.</div>`;
  /* Ohne Meet-Link enthält JEDE Bestätigung und Erinnerung keinen Gesprächslink —
     die Mail geht trotzdem raus, nur ohne das Einzige, was die Kundin braucht.
     Das darf nicht still passieren. */
  if(!String(co.meet_link||'').trim())
    h+=`<div class="card" style="margin-top:12px;border-left:3px solid var(--clay)">
      <b>Kein Google-Meet-Link hinterlegt.</b><div class="muted" style="margin-top:4px">
      Buchungsbestätigung und Erinnerung verschicken dann keinen Gesprächslink.
      Einmalig anlegen: meet.google.com &rarr; „Für später erstellen“ &rarr; Link kopieren
      &rarr; unten in „Google-Meet-Link“ einfügen &rarr; speichern.</div></div>`;
  h+=`<div class="card" style="margin-top:12px">`;

/* ── Beleg-Leser: Vorschlag + Zeilen-Bestätigung ──
   Der Leser bucht nie selbst. Jede gelesene Zeile trägt ein ✓, das die
   Betreiberin setzen muss (Bearbeiten der Zeile bestätigt sie automatisch);
   ohne alle ✓ bleibt Speichern gesperrt. Beim Speichern wandert die Datei an
   die Buchung und die ENDWERTE gehen als Feedback zurück — daraus lernt er. */
let BU_SCAN=null;   // {id, rel, name, lieferant, felder, quelle, confirmed:{}}
const SCAN_LBL={datum:'Datum',text:'Text',brutto:'Brutto',iva_satz:'IVA-Satz',kategorie:'Kategorie'};
const SCAN_INPUT={datum:'buDatum',text:'buText',brutto:'buBrutto',iva_satz:'buIva',kategorie:'buKat'};
function buScanPick(){
  const inp=document.createElement('input'); inp.type='file';
  inp.accept='image/*,.pdf,.heic'; inp.setAttribute('capture','environment');
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f)return;
    if(f.size>12*1024*1024){toast('Größer als 12 MB');return;}
    $('#buScanPanel').innerHTML='<div class="buwarn soft">📖 Der Leser liest den Beleg … das dauert bis zu einer Minute.</div>';
    const b64=await new Promise(res=>{const rd=new FileReader();
      rd.onload=()=>res(String(rd.result).split(',')[1]); rd.readAsDataURL(f);});
    const r=await api('/api/buchhaltung/scan',{method:'POST',body:JSON.stringify({filename:f.name,blob_b64:b64})});
    if(!r.ok){$('#buScanPanel').innerHTML='';fail(r,'Upload fehlgeschlagen');return;}
    const b=r.body;
    BU_SCAN={id:b.scan_id,rel:b.rel,name:b.name,lieferant:b.lieferant||'',
             felder:b.felder||{},quelle:b.quelle||{},confirmed:{}};
    if(b.hinweis){ $('#buScanPanel').innerHTML=`<div class="buwarn soft">📎 ${esc(b.hinweis)}</div>`; return; }
    for(const[f,val]of Object.entries(BU_SCAN.felder)){
      const el=$('#'+SCAN_INPUT[f]); if(!el)continue;
      el.value=f==='brutto'?String(val).replace('.',','):String(val);
      if(f==='kategorie'){const o=el.selectedOptions[0];if(o&&!('iva_satz'in BU_SCAN.felder))$('#buIva').value=o.dataset.iva;}
      el.addEventListener('input',()=>buScanConfirm(f,true),{once:true});
    }
    buScanRender();
  };
  inp.click();
}
function buScanConfirm(f,silent){
  if(!BU_SCAN)return;
  BU_SCAN.confirmed[f]=!silent?!BU_SCAN.confirmed[f]:true;
  buScanRender();
}
function buScanRender(){
  const s=BU_SCAN, box=$('#buScanPanel'); if(!s||!box)return;
  const open=Object.keys(s.felder).filter(f=>!s.confirmed[f]);
  let h=`<div class="card" style="background:var(--cream);margin-bottom:12px">
    <div style="font-size:.74rem;color:var(--ink-soft);margin-bottom:6px">📖 Gelesen aus <b>${esc(s.name)}</b>${s.lieferant?` · Lieferant <b>${esc(s.lieferant)}</b>`:''} — <b>jede Zeile bestätigen</b> (✓) oder im Formular korrigieren:</div>`;
  h+=Object.entries(s.felder).map(([f,v])=>{
    const ok=!!s.confirmed[f];
    const unsure=String(s.quelle[f]||'').includes('unsicher');
    return `<div class="row" style="justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:5px 0">
      <span style="font-size:.8rem"><b>${SCAN_LBL[f]}</b>: ${esc(f==='brutto'?eur2(v):(f==='kategorie'?( (BU.kategorien.find(k=>k.key===v)||{}).name||v):v))}
        <span class="muted" style="font-size:.68rem">· ${esc(s.quelle[f]||'gelesen')}</span>${unsure?' <span class="chip-warn">unsicher</span>':''}</span>
      <button class="btn sm ${ok?'ok':''}" onclick="buScanConfirm('${f}')">${ok?'✓ bestätigt':'✓ stimmt'}</button></div>`;
  }).join('');
  h+=`<div style="font-size:.72rem;margin-top:7px;color:${open.length?'var(--clay-d)':'var(--ok)'}">${
    open.length?`Noch ${open.length} Zeile(n) unbestätigt — Speichern ist so lange gesperrt.`
    :'Alles bestätigt — der Beleg kann gespeichert werden; die Datei hängt sich automatisch an.'}</div></div>`;
  box.innerHTML=h;
}
async function buSave(){
  const v=id=>($('#'+id)||{}).value||'';
  const brutto=parseFloat(String(v('buBrutto')).replace(',','.'));
  if(!v('buText').trim()){toast('Text fehlt');return;}
  if(!(brutto>0)){toast('Brutto fehlt');return;}
  if(BU_SCAN&&BU_SCAN.felder){
    const open=Object.keys(BU_SCAN.felder).filter(f=>!BU_SCAN.confirmed[f]);
    if(open.length){toast('Bitte erst jede gelesene Zeile bestätigen: '+open.map(f=>SCAN_LBL[f]).join(', '));return;}
  }
  const r=await api('/api/buchhaltung/entry',{method:'POST',body:JSON.stringify({
    datum:v('buDatum'),typ:v('buTyp'),kategorie:v('buKat'),text:v('buText'),
    brutto:brutto,iva_satz:v('buIva'),zahlung:v('buZahlung'),
    privat_pct:parseFloat(v('buPrivat')||'0'),status:v('buStatus'),faellig_am:v('buFaellig')})});
  if(!r.ok){fail(r,'Speichern fehlgeschlagen');return;}
  if(BU_SCAN){
    const u=await api('/api/buchhaltung/scan/uebernahme',{method:'POST',body:JSON.stringify({
      scan_id:BU_SCAN.id,entry_id:r.body.entry.id,lieferant:BU_SCAN.lieferant})});
    toast('Beleg '+r.body.entry.beleg+(u.ok?' gespeichert · Datei angehängt · Leser hat gelernt':' gespeichert (Datei-Übernahme fehlgeschlagen)'));
    BU_SCAN=null;
  }else{
    toast('Beleg '+r.body.entry.beleg+' gespeichert — jetzt 📎 die Datei anhängen');
  }
  await showBuchhaltung();
}
async function buBezahlt(id){
  const v=await modal({title:'✓ Als bezahlt buchen',body:'Das <b>Zahldatum wird zum Buchungsdatum</b> (Zufluss/Abfluss).',
    ok:'Buchen',fields:[{id:'datum',label:'Zahldatum (JJJJ-MM-TT)',value:new Date().toISOString().slice(0,10),required:true}]});
  if(!v)return;
  const r=await api('/api/buchhaltung/bezahlt',{method:'POST',body:JSON.stringify({id,datum:v.datum})});
  r.ok?(toast('Gebucht'),showBuchhaltung()):fail(r,'Fehlgeschlagen');
}
async function buStorno(id){
  if(!await modal({title:'⤺ Stornieren',body:'Der Beleg bleibt sichtbar (durchgestrichen) und zählt in keiner Summe mehr. Nummernkreis bleibt lückenlos.',ok:'Stornieren',danger:true}))return;
  const r=await api('/api/buchhaltung/storno',{method:'POST',body:JSON.stringify({id})});
  r.ok?(toast('Storniert'),showBuchhaltung()):fail(r,'Fehlgeschlagen');
}
async function buTrash(id,restore){
  if(!restore&&!await modal({title:'🗑 In den Papierkorb',body:'Weich — wiederherstellbar, Dateien bleiben liegen (6 Jahre Aufbewahrung).',ok:'Verschieben'}))return;
  const r=await api('/api/buchhaltung/papierkorb',{method:'POST',body:JSON.stringify({id,restore:!!restore})});
  r.ok?(toast(restore?'Wiederhergestellt':'Im Papierkorb'),showBuchhaltung()):fail(r,'Fehlgeschlagen');
}
function buAttach(id){
  const inp=document.createElement('input'); inp.type='file';
  inp.accept='.pdf,.jpg,.jpeg,.png,.webp,.heic';
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f)return;
    if(f.size>12*1024*1024){toast('Größer als 12 MB');return;}
    const b64=await new Promise(res=>{const rd=new FileReader();
      rd.onload=()=>res(String(rd.result).split(',')[1]); rd.readAsDataURL(f);});
    const r=await api('/api/buchhaltung/datei',{method:'POST',body:JSON.stringify({id,filename:f.name,blob_b64:b64})});
    r.ok?(toast('Datei angehängt'),showBuchhaltung()):fail(r,'Upload fehlgeschlagen'); };
  inp.click();
}
async function buFile(rel){
  const r=await fetch('/api/buchhaltung/datei?rel='+encodeURIComponent(rel),{headers:{'X-Auralis-Key':KEY}});
  if(!r.ok){toast('Datei nicht gefunden');return;}
  const u=URL.createObjectURL(await r.blob()); window.open(u,'_blank'); setTimeout(()=>URL.revokeObjectURL(u),30000);
}
async function buExport(fmt){
  const r=await fetch('/api/buchhaltung/export?jahr='+BU_JAHR+'&fmt='+fmt,{headers:{'X-Auralis-Key':KEY}});
  if(!r.ok){toast('Export fehlgeschlagen');return;}
  saveBlob(await r.blob(),'auralis-buchhaltung-'+BU_JAHR+(fmt==='csv'?'.csv':'.pdf'));
}
async function buAnfang(){
  const v=await modal({title:'Anfangsbestand Bank',body:'Kontostand am 1. Januar — nur für den Cashflow.',ok:'Speichern',
    fields:[{id:'betrag',label:'Betrag (€)',value:String(BU?BU.anfangsbestand:0),required:true}]});
  if(!v)return;
  const r=await api('/api/buchhaltung/anfangsbestand',{method:'POST',body:JSON.stringify({betrag:parseFloat(String(v.betrag).replace(',','.'))||0})});
  r.ok?(toast('Gespeichert'),showBuchhaltung()):fail(r,'Fehlgeschlagen');
}

/* ═════════ FINANZAMT (AEAT · Modelo 303 / 130 / 390 / Renta) ═════════ */
let AMT=null, AMT_JAHR=String(new Date().getFullYear()), AMT_ALLE=false;
async function showFinanzamt(){
  const r=await api('/api/finanzamt?jahr='+AMT_JAHR);
  if(!r.ok){fail(r,'Finanzamt nicht ladbar');return;}
  AMT=r.body; renderAmt();
}
async function amtJahr(j){ AMT_JAHR=j; AMT_ALLE=false; await showFinanzamt(); }
function renderAmt(){
  const a=AMT;
  const jahre=[String(+a.jahr-1),a.jahr,String(+a.jahr+1)];
  let h=secHead('06','Finanzamt','AEAT — Fristen mit Startfenster, Kennzahlen zum Kopieren, nichts selbst gerechnet: alles kommt aus der Buchhaltung.');
  h+=ypills(a.jahr,'amtJahr',jahre);
  /* Alta-Gate */
  if(!a.alta){
    h+=`<div class="buwarn"><b>Noch keine Alta hinterlegt.</b> Vor der Anmeldung beim Finanzamt (Modelo 036/037, macht die Gestoría) gibt es keine einzige Pflicht — darum steht hier bewusst keine Frist. Nach der Gründung das Alta-Datum eintragen, dann erscheinen genau die Perioden, die dich betreffen.
      <div class="row" style="margin-top:8px;gap:6px"><input type="date" id="altaD" style="max-width:180px"><button class="btn dark sm" onclick="amtAlta()">Alta-Datum speichern</button></div></div>`;
    $('#view').innerHTML=h; return;
  }
  h+=`<div class="muted" style="margin:-6px 0 10px;font-size:.76rem">Alta (036/037): <b>${esc(a.alta)}</b> · <a href="#" onclick="amtAltaEdit();return false">ändern</a> · Perioden davor existieren nicht.</div>`;
  const offen=a.fristen.filter(f=>!f.erledigt_am), erled=a.fristen.filter(f=>f.erledigt_am);
  const startbar=offen.filter(f=>f.startbar&&f.sichtbar);
  if(startbar.length)
    h+=`<div class="buwarn soft">▶ <b>Heute schon möglich:</b> ${startbar.map(f=>esc(f.titel)).join(' · ')} — wer heute startet, behält den Puffer; wer am Fälligkeitstag beginnt, hat keinen.</div>`;
  /* Fristenkarten */
  const zeig=offen.filter(f=>AMT_ALLE||f.sichtbar);
  const versteckt=offen.length-zeig.length;
  h+=`<h2>Fristen <span class="muted">· nächste ${a.fenster_tage} Tage${AMT_ALLE?' + alle':''}</span></h2>`;
  h+=zeig.map(f=>{
    const late=f.tage<0;
    const dchip=late?`<b class="late">${-f.tage} Tage überfällig</b>`:`fällig ${esc(f.faellig_am)} · in <b>${f.tage} Tagen</b>`;
    const start=late
      ?`<div class="startline" style="color:var(--clay-d);font-weight:600">⚠ Überfällig — sofort einreichen. Säumniszuschläge (recargos) wachsen mit jedem Monat.</div>`
      :f.startbar
      ?`<div class="startline go">▶ Jetzt möglich — noch ${f.puffer_tage} Tage Puffer, wenn du heute startest.</div>`
      :`<div class="startline">Startet am ${esc(f.start_ab)} (${esc(f.start_grund)}) — in ${f.tage_bis_start} Tagen.</div>`;
    return `<div class="fristc ${late?'late':''}">
      <div class="hd"><span class="ti">${esc(f.titel)}</span>
        ${f.betrag!=null?`<span class="num" style="font-weight:600">${eur2(f.betrag)}</span>`:''}
        <span class="dd">${dchip}</span></div>
      <div class="act">${esc(f.aktion)}</div>
      <div class="wo">${esc(f.wohin)} · ${esc(f.pfad)}</div>
      ${start}
      <div class="tun">${esc(f.tun)}</div>
      <div class="btns">
        <a class="btn ghost sm" href="${esc(f.url)}" target="_blank" rel="noopener">AEAT öffnen ↗</a>
        <button class="btn ghost sm" onclick="amtDossier('${esc(f.key)}')">📄 Dossier</button>
        ${f.betrag!=null?`<button class="btn ghost sm" onclick="copyNum(${f.betrag})">Betrag kopieren</button>`:''}
        <button class="btn ok sm" onclick="amtDone('${esc(f.key)}',true)">✓ erledigt</button>
      </div></div>`;}).join('')||'<p class="muted">Keine offene Frist im Fenster.</p>';
  if(versteckt>0&&!AMT_ALLE)h+=`<button class="btn ghost sm" onclick="AMT_ALLE=true;renderAmt()">+ ${versteckt} weitere Termine anzeigen</button>`;
  if(erled.length){
    h+=`<details style="margin-top:12px"><summary class="muted">Erledigt (${erled.length})</summary><div class="card" style="margin-top:8px">`;
    h+=erled.map(f=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0">
      <span>✓ ${esc(f.titel)} <span class="muted">· abgehakt ${esc(f.erledigt_am)}</span></span>
      <button class="btn ghost sm" onclick="amtDone('${esc(f.key)}',false)">Aus Versehen? Wieder öffnen</button></div>`).join('');
    h+=`</div></details>`;
  }
  /* Kennzahlen-Blöcke — jede Zahl mit Kopieren-Knopf: abgetippt = Zahlendreher */
  const C=v=>`<button class="copyb" onclick="copyNum(${v})">kopieren</button>`;
  h+=`<h2>Modelo 303 — IVA je Quartal</h2><div class="tscroll"><table class="fin">
    <tr><th>Q</th><th>Basis 21 %</th><th>IVA repercutido</th><th>IVA soportado</th><th>Zahllast</th></tr>`;
  h+=a.iva303.quartale.map(q=>`<tr><td>Q${q.q}</td>
    <td class="num">${eur2(q.basis)} ${C(q.basis)}</td>
    <td class="num">${eur2(q.repercutido)} ${C(q.repercutido)}</td>
    <td class="num">${eur2(q.soportado)} ${C(q.soportado)}</td>
    <td class="num"><b>${eur2(q.zahllast)}</b> ${C(q.zahllast)}</td></tr>`).join('');
  h+=`<tr class="strong"><td>Jahr (→ Modelo 390)</td><td></td><td class="num">${eur2(a.iva303.jahr.repercutido)} ${C(a.iva303.jahr.repercutido)}</td>
    <td class="num">${eur2(a.iva303.jahr.soportado)} ${C(a.iva303.jahr.soportado)}</td>
    <td class="num"><b>${eur2(a.iva303.jahr.zahllast)}</b> ${C(a.iva303.jahr.zahllast)}</td></tr></table></div>`;
  h+=`<h2>Modelo 130 — IRPF-Vorauszahlung (20 % kumuliert)</h2><div class="tscroll"><table class="fin">
    <tr><th>Q</th><th>Einnahmen kum.</th><th>Ausgaben kum.</th><th>Difícil just.</th><th>Rendimiento</th><th>bereits gezahlt</th><th>Ergebnis</th></tr>`;
  h+=a.mod130.map(m=>`<tr><td>Q${m.q}</td>
    <td class="num">${eur2(m.ingresos)} ${C(m.ingresos)}</td>
    <td class="num">${eur2(m.gastos)} ${C(m.gastos)}</td>
    <td class="num">${eur2(m.dificil)}</td>
    <td class="num">${eur2(m.rendimiento)} ${C(m.rendimiento)}</td>
    <td class="num">${eur2(m.vorher)}</td>
    <td class="num"><b>${eur2(m.resultado)}</b> ${C(m.resultado)}</td></tr>`).join('');
  h+=`</table></div>`;
  h+=`<h2>Renta (Modelo 100) — Rubriken fürs Jahr</h2><div class="tscroll"><table class="fin">`;
  h+=a.renta.map(x=>`<tr><td>${esc(x.renta)}</td><td class="num">${eur2(x.betrag)} ${C(x.betrag)}</td></tr>`).join('');
  h+=`</table></div>`;
  h+=`<h2>Rücklagen</h2><div class="card"><div class="kv"><span class="k">IRPF-Rücklage</span><span class="num">${eur2(a.ruecklagen.irpf)} <span class="muted">zusätzlich zu ${eur2(a.ruecklagen.mod130_soll)} über Modelo 130</span></span></div>
    <div class="kv"><span class="k">IVA-Rücklage</span><span class="num">${eur2(a.ruecklagen.iva)} <span class="muted">das ist Durchlaufgeld — nie ausgeben</span></span></div>
    <div class="muted" style="margin-top:6px;font-size:.75rem">${esc(a.ruecklagen.hinweis)} Die RETA-Cuota läuft monatlich und ist als Ausgabe erfasst.</div></div>`;
  $('#view').innerHTML=h;
}
async function amtAlta(){
  const d=($('#altaD')||{}).value; if(!d){toast('Datum wählen');return;}
  const r=await api('/api/buchhaltung/alta',{method:'POST',body:JSON.stringify({datum:d})});
  r.ok?(toast('Alta gespeichert'),showFinanzamt()):fail(r,'Fehlgeschlagen');
}
async function amtAltaEdit(){
  const v=await modal({title:'Alta (Modelo 036/037)',body:'Das Datum der Anmeldung beim Finanzamt. Perioden davor existieren nicht. Leer = noch nicht gegründet.',ok:'Speichern',
    fields:[{id:'datum',label:'Datum (JJJJ-MM-TT, leer = löschen)',value:AMT.alta||''}]});
  if(v==null)return;
  const r=await api('/api/buchhaltung/alta',{method:'POST',body:JSON.stringify({datum:v.datum||''})});
  r.ok?(toast('Gespeichert'),showFinanzamt()):fail(r,'Fehlgeschlagen');
}
async function amtDone(key,done){
  const r=await api('/api/finanzamt/erledigt',{method:'POST',body:JSON.stringify({key,done})});
  r.ok?(toast(done?'✓ erledigt':'Wieder geöffnet'),showFinanzamt()):fail(r,'Fehlgeschlagen');
}
async function amtDossier(key){
  toast('Dossier wird erzeugt …');
  const r=await fetch('/api/finanzamt/dossier?jahr='+AMT_JAHR+'&key='+encodeURIComponent(key),{headers:{'X-Auralis-Key':KEY}});
  if(!r.ok){toast('Dossier fehlgeschlagen');return;}
  saveBlob(await r.blob(),key+'.pdf');
}

boot();
</script>
