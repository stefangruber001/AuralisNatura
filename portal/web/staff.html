<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Auralis Natura — Betriebskonsole</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2A211A;--ink-soft:#5C4A3A;--ink-faint:#8C7E6E;--forest:#3D2719;--forest-deep:#27170E;--clay:#A8492A;--clay-d:#8a3b22;--gold:#AD7A32;--sage:#927B4A;--sage-soft:#DAC79E;--paper:#F5EEE0;--cream:#FBF6EB;--line:rgba(61,39,25,.16);--line2:rgba(61,39,25,.28);--ok:#3c7a4e;--fd:"Fraunces",Georgia,serif;--fb:"Hanken Grotesk",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:14px}
b,strong{font-weight:600}
.num{font-variant-numeric:tabular-nums}
/* ───────── header ───────── */
header{display:flex;align-items:center;gap:14px;padding:10px 22px;background:var(--cream);border-bottom:2px solid var(--clay);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.hbrand{display:flex;align-items:center;gap:10px;min-width:0}
.hbrand img.seal{width:36px;height:36px}
.hbrand .wm{line-height:1.1}
.hbrand .wm .a{font-family:var(--fd);font-weight:500;font-size:1.12rem;letter-spacing:.04em}
.hbrand .wm .b{font-size:.56rem;letter-spacing:.28em;text-transform:uppercase;color:var(--clay);font-weight:600}
.hphoto{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line2)}
.hsearch{flex:1;max-width:430px;margin:0 auto;position:relative;min-width:180px}
.hsearch input{width:100%;font-family:inherit;font-size:.85rem;padding:.55em .9em .55em 2.1em;border:1px solid var(--line2);background:#fff;border-radius:0}
.hsearch .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:.85rem}
.hits{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line2);border-top:0;max-height:300px;overflow:auto;z-index:40;box-shadow:0 14px 30px rgba(61,39,25,.14)}
.hit{padding:8px 12px;font-size:.82rem;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.hit:hover{background:var(--paper)}
.hit .k{color:var(--ink-faint);font-size:.7rem}
.hright{display:flex;align-items:center;gap:8px;margin-left:auto}
.vchip{font-size:.66rem;letter-spacing:.06em;color:var(--ink-faint);border:1px solid var(--line);padding:3px 9px;background:#fff;white-space:nowrap}
.hbtn{font-family:inherit;font-size:.78rem;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--ink-soft);padding:.45em .75em;cursor:pointer}
.hbtn:hover{border-color:var(--clay);color:var(--clay)}
.hmenu{position:relative}
.hdrop{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line2);min-width:170px;z-index:40;box-shadow:0 14px 30px rgba(61,39,25,.14)}
.hdrop button{display:block;width:100%;text-align:left;font-family:inherit;font-size:.82rem;padding:9px 14px;border:0;background:none;cursor:pointer;color:var(--ink-soft)}
.hdrop button:hover{background:var(--paper);color:var(--clay)}
/* ───────── tabs ───────── */
.tabbar{display:flex;gap:0;background:var(--cream);border-bottom:1px solid var(--line);padding:0 22px;overflow-x:auto;position:sticky;top:59px;z-index:20}
.tab{font-family:inherit;font-size:.82rem;font-weight:600;letter-spacing:.03em;padding:.8em 1.25em .7em;border:0;background:transparent;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab small{display:block;font-size:.55rem;letter-spacing:.16em;color:var(--ink-faint);font-weight:600;margin-top:1px}
.tab.on{color:var(--clay);border-bottom-color:var(--clay)}
.tab.on small{color:var(--gold)}
.view{padding:20px 26px 60px;max-width:1280px;margin:0 auto}
h1{font-family:var(--fd);font-weight:400;font-size:1.55rem}
h2{font-family:var(--fd);font-weight:400;font-size:1.12rem;color:var(--forest);margin:24px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:.4em;font-family:inherit;font-weight:600;font-size:.78rem;letter-spacing:.03em;padding:.62em 1.1em;border:0;cursor:pointer;background:var(--clay);color:#FBF3EC;border-radius:0;white-space:nowrap}
.btn:hover{background:var(--clay-d)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.ghost:hover{background:#fff;color:var(--clay)}
.btn.dark{background:var(--forest)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:.42em .75em;font-size:.7rem}
.btn:disabled{opacity:.45;cursor:default}
input,textarea,select{width:100%;font-family:inherit;font-size:.9rem;color:var(--ink);background:#fff;border:1px solid var(--line2);padding:.55em .7em;border-radius:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--clay)}
textarea{min-height:70px;resize:vertical}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 14px;font-size:.88rem;margin:4px 0;align-items:center}
.kv .k{color:var(--ink-faint)}
.card{background:var(--cream);border:1px solid var(--line);padding:16px 18px;margin:10px 0}
.sec{background:#fff;border:1px solid var(--line);padding:12px 14px;margin:8px 0}
.sec .t{font-family:var(--fd);color:var(--forest);margin-bottom:4px}
.flagbox{background:#f7ddd6;border:1px solid var(--clay);border-left:5px solid var(--clay);color:#7a2f18;padding:12px 15px;margin:10px 0;font-size:.9rem;font-weight:600}
.approve-panel{margin-top:14px;padding:14px 16px;background:var(--cream);border:1px solid var(--line);border-top:2px solid var(--forest);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pill{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--line2);color:var(--ink-soft);white-space:nowrap;background:#fff}
.pill.lead{background:#F4E8D2;border-color:var(--gold);color:#6b5320}
.pill.call{background:var(--gold);color:#fff;border-color:var(--gold)}
.pill.won,.pill.invited{background:var(--forest);color:#F6F2E7;border-color:var(--forest)}
.pill.intake,.pill.prep{background:#fff;border-color:var(--sage);color:var(--sage)}
.pill.draft,.pill.review{background:#FBF6EC;border-color:#C4A882;color:#6F4F2C}
.pill.sent{background:var(--sage);color:#fff;border-color:var(--sage)}
.pill.done{background:#EEF6EF;border-color:#6DA986;color:#3F7B5A}
.pill.lost{background:#eee;color:#777;border-color:#ccc}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--forest);color:#F6F2E7;padding:11px 20px;font-size:.85rem;opacity:0;transition:.3s;z-index:60}
.toast.on{opacity:1}
.muted{color:#6E6152;font-size:.8rem}.hidden{display:none}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
pre{white-space:pre-wrap;font-family:inherit;font-size:.85rem;color:var(--ink-soft)}
/* ───────── login ───────── */
.gate{max-width:430px;margin:11vh auto;background:var(--cream);border:1px solid var(--line);border-top:3px solid var(--clay);padding:34px;text-align:center}
.gate img{width:64px;height:64px;margin-bottom:10px}
.gate .wm{font-family:var(--fd);font-size:1.5rem}
.gate .sub{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--clay);font-weight:600;margin:2px 0 20px}
/* ───────── alerts ───────── */
.alert{border:1px solid var(--line2);border-left:5px solid var(--gold);background:#FBF6EC;padding:12px 16px;margin:0 0 10px}
.alert.error{border-left-color:var(--clay);background:#FCEFEC}
.alert.info{border-left-color:#8AA6C8;background:#EEF3F9}
.alert .t{font-weight:600;font-size:.88rem}
.alert .s{font-size:.76rem;color:var(--ink-soft)}
.alert .it{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;padding:4px 0;border-top:1px dashed var(--line)}
.alert .go{color:var(--clay);cursor:pointer;font-weight:600;white-space:nowrap}
@keyframes pmflash{0%{box-shadow:0 0 0 3px var(--gold);background:#FBF3DC}70%{box-shadow:0 0 0 3px var(--gold);background:#FBF3DC}100%{box-shadow:none;background:transparent}}
.pm-flash{animation:pmflash 2.4s ease-out}
/* ───────── cockpit ───────── */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px}
.htile{background:var(--cream);border:1px solid var(--line);padding:16px 18px;position:relative}
.htile.hi{border-top:3px solid var(--clay)}
.htile .v{font-family:var(--fd);font-size:1.75rem;color:var(--forest);line-height:1.1}
.htile .l{font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px}
.htile .s{font-size:.74rem;color:var(--sage);margin-top:2px}
.donutwrap{display:flex;gap:16px;align-items:center}
.donut{width:86px;height:86px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center}
.donut i{width:62px;height:62px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-family:var(--fd);font-size:1.05rem;color:var(--forest)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.cols2>div{min-width:0}
.rank span{min-width:0;overflow-wrap:anywhere}
.rank{display:grid;grid-template-columns:26px 1fr auto;gap:6px 10px;font-size:.85rem;align-items:baseline}
.rank .i{font-family:var(--fd);color:var(--gold)}
.frow{display:grid;grid-template-columns:130px 1fr 84px;gap:10px;align-items:center;font-size:.82rem;margin:7px 0}
.fbar{height:18px;background:var(--sage-soft);position:relative}
.fbar>i{display:block;height:100%;background:var(--forest)}
.frow .fv{text-align:right;color:var(--ink-soft)}
/* ───────── journey (Paramur stage cards) ───────── */
.cj-stage{border:1px solid var(--line);background:var(--cream);margin:0 0 14px}
.cj-stage>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding:13px 18px;user-select:none}
.cj-stage>summary::-webkit-details-marker{display:none}
.cj-num{font-family:var(--fd);font-size:1.25rem;color:var(--gold)}
.cj-title{font-family:var(--fd);font-size:1.08rem;color:var(--forest)}
.cj-count{margin-left:auto;font-size:.72rem;color:var(--ink-faint)}
.cj-item{display:grid;grid-template-columns:190px minmax(0,1fr) 118px 320px;gap:10px;align-items:center;background:#fff;border-top:1px solid var(--line);padding:10px 18px}
.cj-id .nm{font-weight:600;font-size:.86rem}
.cj-id .id{font-size:.7rem;color:var(--ink-faint)}
.cj-mid{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;font-size:.78rem;color:var(--ink-soft)}
.cj-date{text-align:right;font-size:.76rem;color:var(--ink-faint)}
.cj-date .warn{color:var(--clay);font-weight:600}
.cj-act{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:780px){.cj-item{grid-template-columns:1fr;gap:6px}.cj-date{text-align:left}.cj-act{justify-content:flex-start}}
/* ───────── finanzen ───────── */
table.fin{width:100%;border-collapse:collapse;font-size:.84rem;background:#fff;border:1px solid var(--line)}
table.fin th{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);text-align:right;padding:8px 12px;border-bottom:1px solid var(--line2);background:var(--cream)}
table.fin th:first-child,table.fin td:first-child{text-align:left}
table.fin td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.fin tr.strong td{font-weight:600;border-top:2px solid var(--line2);background:var(--cream)}
table.fin td.neg{color:var(--clay)}
table.fin tr.plan td{color:var(--ink-faint)}
.finnote{font-size:.72rem;color:var(--ink-faint);margin-top:6px}
/* ───────── plandaten ───────── */
.plangrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.plan-in{border-left:3px solid var(--gold)!important;background:#FFFDF7!important}
/* ───────── kunden table ───────── */
table.pt{width:100%;border-collapse:collapse;font-size:.85rem;background:#fff;border:1px solid var(--line)}
table.pt th{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--cream)}
table.pt td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.pt tr:hover td{background:var(--paper)}
.pedit{background:var(--cream);border:1px solid var(--line2);border-top:3px solid var(--gold);padding:16px 18px;margin:0 0 4px}
.pichip{display:inline-block;font-size:.7rem;background:#fff;border:1px solid var(--line2);padding:2px 9px;margin:2px 3px 2px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── section heads (Paramur numbered) ── */
.sechead{display:grid;grid-template-columns:74px 1fr;gap:4px 18px;margin:16px 0 6px;align-items:baseline}
.sechead .n{font-family:var(--fd);font-size:2.3rem;color:var(--clay);line-height:1}
.sechead h1{margin:0}
.sechead .sub{grid-column:2;color:var(--ink-soft);font-size:.88rem}
.dateline{font-family:var(--fd);font-style:italic;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:10px 2px;margin-bottom:14px}
.kick{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
/* ── tab chip tags inline ── */
.tab .tag{display:inline-block;font-size:.55rem;letter-spacing:.14em;font-weight:600;border:1px solid #6DA986;color:#3F7B5A;background:#EEF6EF;padding:1px 6px;margin-left:7px;vertical-align:1px}
.tab.edit .tag{border-color:#C4A882;color:#6F4F2C;background:#FBF6EC}
/* ── hero cards (Jahresziel / Break-even / Konversion) ── */
.gcard{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);padding:18px 20px;margin:12px 0}
.gcard .ttl{font-family:var(--fd);font-size:1.25rem}
.gcard .ttl .kick{margin-left:10px}
.bignum{font-family:ui-monospace,Menlo,monospace;font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.bignum .a{color:var(--clay)}
.chartbox{margin-top:12px}
.chartbox svg{width:100%;height:auto;display:block}
.cleg{display:flex;gap:18px;font-size:.78rem;color:var(--ink-soft);margin-top:8px;flex-wrap:wrap}
.cleg .sw{display:inline-block;width:18px;height:0;border-top:3px solid var(--clay);vertical-align:3px;margin-right:6px}
.cleg .sw.pl{border-top:3px dashed #3F7B5A}
.chip-ok{display:inline-block;font-size:.7rem;letter-spacing:.1em;font-weight:600;text-transform:uppercase;background:#EEF6EF;border:1px solid #6DA986;color:#3F7B5A;padding:4px 10px}
.chip-warn{display:inline-block;font-size:.7rem;letter-spacing:.1em;font-weight:600;text-transform:uppercase;background:#FCEFEC;border:1px solid #D19A8A;color:#B0553F;padding:4px 10px}
.pbar{height:6px;background:var(--sage-soft);margin:12px 0 10px;position:relative}
.pbar>i{display:block;height:100%;background:var(--clay)}
.hugepct{font-family:ui-monospace,Menlo,monospace;font-size:2.2rem;font-weight:600}
/* ── ranking rows (gold mini bars) ── */
.rrow{display:grid;grid-template-columns:30px 1fr 70px 90px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rrow .ri{font-family:var(--fd);font-size:1.15rem;color:var(--clay)}
.rrow .rb{height:10px;background:var(--sage-soft)}
.rrow .rb>i{display:block;height:100%;background:var(--gold)}
.rrow .rv{text-align:right;font-weight:600}
/* ── alert icon ── */
.alert{display:grid;grid-template-columns:44px 1fr;gap:4px 12px}
.alert .ico{font-size:1.7rem;grid-row:span 3;align-self:start}
.alert .it,.alert .goline{grid-column:2}
/* ── table scroll wrapper ── */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tscroll table{min-width:100%}
.tscroll table.fin{min-width:520px}
/* ── MOBILE ≤780px ── */
@media (max-width:780px){
  header{padding:10px 14px;gap:10px;position:static}
  .tabbar{position:sticky;top:0}
  .hbrand .wm .a{font-size:1rem}
  .vchip{display:none}
  .hsearch{order:5;flex-basis:100%;max-width:none;margin:2px 0 0}
  .hright{gap:6px}
  #logoutBtn span{display:none}
  .tabbar{padding:0 10px}
  .hbtn{min-height:40px;min-width:40px}
  .btn.sm{min-height:40px;padding:.6em .9em}
  .cj-act{flex-direction:column;align-items:stretch}
  .cj-act .btn{width:100%;justify-content:center}
  .approve-panel{flex-direction:column;align-items:stretch}
  .approve-panel .btn{width:100%;justify-content:center}
  table.fin th{font-size:.68rem}
  .view{padding:14px 14px 60px}
  .sechead{grid-template-columns:56px 1fr}
  .sechead .n{font-size:1.8rem}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv .k{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase}
  .plangrid{grid-template-columns:1fr}
  .cols2{grid-template-columns:1fr}
  .btn{width:100%;justify-content:center}
  .btn.sm{width:auto}
  .row .btn{flex:1 1 auto}
  /* kunden table -> stacked cards */
  table.pt,table.pt tbody{display:block}
  table.pt thead,table.pt tr.hd{display:none}
  table.pt tr{display:block;background:#fff;border:1px solid var(--line);margin:0 0 12px;padding:12px 14px}
  table.pt td{display:block;border:0;padding:4px 0;text-align:left!important;white-space:normal!important}
  table.pt td[data-l]::before{content:attr(data-l);display:block;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  table.pt td.acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:10px}
  table.pt td.acts .btn{flex:1 1 44%;justify-content:center;padding:.7em .5em}
  .cj-item{grid-template-columns:1fr}
  .rrow{grid-template-columns:24px 1fr 50px 84px}
}

/* ── branded modal ── */
.mask{position:fixed;inset:0;background:rgba(42,33,26,.45);z-index:70;display:grid;place-items:center;padding:18px}
.mbox{background:var(--cream);border:1px solid var(--line2);border-top:3px solid var(--clay);max-width:480px;width:100%;padding:22px 24px;box-shadow:0 24px 60px rgba(42,33,26,.25)}
.mbox.danger{border-top-color:#B0553F}
.mbox h3{font-family:var(--fd);font-weight:400;font-size:1.2rem;margin-bottom:8px}
.mbox .mb{font-size:.9rem;color:var(--ink-soft);line-height:1.55}
.mbox .mf{margin-top:14px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mbox label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:12px 0 4px}
.pwbox{font-family:ui-monospace,Menlo,monospace;font-size:1.02rem;background:#fff;border:1px dashed var(--line2);padding:10px 12px;margin-top:6px;display:flex;justify-content:space-between;gap:10px;align-items:center;word-break:break-all}
@media (max-width:780px){.mbox .mf{flex-direction:column-reverse}.mbox .mf .btn{width:100%;justify-content:center}}
</style></head>
<body>
<!-- ───────── LOGIN ───────── -->
<div id="gate" class="gate">
  <img src="/assets/seal.png" alt="">
  <div class="wm">Auralis Natura</div>
  <div class="sub">Betriebskonsole</div>
  <input id="key" type="password" placeholder="Staff-Schlüssel" onkeydown="if(event.key==='Enter')unlock()">
  <div style="margin-top:14px"><button class="btn" style="width:100%;justify-content:center" onclick="unlock()">Anmelden</button></div>
  <div id="gateErr" style="color:var(--clay);font-size:.85rem;margin-top:10px;min-height:1.2em"></div>
  <div class="muted" style="margin-top:14px">In Produktion zusätzlich durch Cloudflare Access geschützt.</div>
</div>

<!-- ───────── APP ───────── -->
<div id="app" class="hidden">
<header>
  <div class="hbrand">
    <img class="seal" src="/assets/seal.png" alt="">
    <div class="wm"><div class="a">AURALIS NATURA</div><div class="b">Betriebskonsole</div></div>
    <img class="hphoto" src="/assets/desiree.jpg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="hsearch">
    <span class="ic">🔍</span>
    <input id="gsearch" placeholder="Suchen: Kundin · Termin · Paket …" oninput="gSearch(this.value)" onfocus="gSearch(this.value)">
    <div class="hits hidden" id="ghits"></div>
  </div>
  <div class="hright">
    <span class="vchip num" id="vchip" style="cursor:pointer" title="Nach Updates suchen" onclick="checkUpdate(this)">Version Auralis</span>
    <button class="hbtn" title="Nach Updates suchen" onclick="checkUpdate(this)">↻</button>
    <div class="hmenu">
      <button class="hbtn" onclick="$('#hdrop').classList.toggle('hidden')">⚙</button>
      <div class="hdrop hidden" id="hdrop">
        <button onclick="go('stamm')">Stammdaten</button>
        <button onclick="go('outbox')">Outbox / Dokumente</button>
        <button onclick="go('system')">System</button>
      </div>
    </div>
    <button class="hbtn" id="logoutBtn" title="Abmelden" onclick="logout()">⏻ <span>Abmelden</span></button>
  </div>
</header>
<nav class="tabbar" id="tabbar">
  <button class="tab on" data-v="cockpit" onclick="go('cockpit')">Cockpit<span class="tag">ANSICHT</span></button>
  <button class="tab" data-v="journey" onclick="go('journey')">Customer Journey<span class="tag">ANSICHT</span></button>
  <button class="tab" data-v="finanzen" onclick="go('finanzen')">Finanzen<span class="tag">ANSICHT</span></button>
  <button class="tab edit" data-v="plan" onclick="go('plan')">Plandaten<span class="tag">BEARBEITEN</span></button>
  <button class="tab edit" data-v="kunden" onclick="go('kunden')">Kundinnen<span class="tag">BEARBEITEN</span></button>
  <button class="tab edit" data-v="termine" onclick="go('termine')">Termine<span class="tag">BEARBEITEN</span></button>
</nav>
<div class="view" id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
let KEY=sessionStorage.getItem('an_staff_key')||'', VIEW='cockpit', CUR=null, notesDirty=false, reportDirty=false;
let ALL_CLIENTS=[], ALL_BOOKINGS=[], PACKAGES=[];
const STAGES=['lead','call','won','invited','intake','prep','draft','review','sent','done','lost'];
const STAGE_DE={lead:'Anfrage',call:'Erstgespräch',won:'Gewonnen',invited:'Zugang gesendet',intake:'Intake',prep:'Vorbereitung',draft:'Entwurf',review:'Review',sent:'Geliefert',done:'Abgeschlossen',lost:'Verloren'};
const SYM_DE={fatigue:'Erschöpfung',sleep:'Schlaf',digestion:'Verdauung',stress:'Stress',hormonal:'Hormone',weight:'Gewicht',skin:'Haut',mood:'Stimmung',pain:'Schmerzen',immune:'Immunsystem',other:'Anderes'};
const FLAG_DE={none:'keine',weight_loss:'Gewichtsverlust',chest_pain:'Brustschmerz',severe_pain:'starke Schmerzen',fainting:'Ohnmacht',self_harm:'Selbstverletzungsgedanken',eating:'Essverhältnis',pregnancy_complication:'Schwangerschafts-Komplikation'};
function stageCls(s){return STAGES.includes(s)?s:'';}
function stageDe(s){return STAGE_DE[s]||s;}
function api(path,opts={}){opts.headers=Object.assign({'Content-Type':'application/json','X-Auralis-Key':KEY},opts.headers||{});
  return fetch(path,opts).then(async r=>({ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))}));}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));}
function fail(r,fb){toast((r&&r.body&&r.body.error)||fb);}
function eur(n){return (n==null?0:n).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';}
function eur2(n){return (n==null?0:n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function days(ts){ if(!ts)return ''; const d=Math.floor((Date.now()-new Date(ts))/864e5); return d<=0?'heute':d+' T'; }
function dt(ts){ return ts?new Date(ts).toLocaleString('de-DE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''; }
document.addEventListener('click',e=>{ if(!e.target.closest('.hmenu'))$('#hdrop')&&$('#hdrop').classList.add('hidden');
  if(!e.target.closest('.hsearch'))$('#ghits')&&$('#ghits').classList.add('hidden'); });


/* ── branded modal system (no native prompt/confirm/alert) ── */
function modal({title,body='',ok='OK',cancel='Abbrechen',danger=false,fields=null}){
  return new Promise(res=>{
    const m=document.createElement('div'); m.className='mask';
    const fhtml=(fields||[]).map(f=>{
      if(f.type==='textarea')return `<label>${esc(f.label)}</label><textarea id="mf-${f.id}" rows="5">${esc(f.value||'')}</textarea>`;
      if(f.type==='select')return `<label>${esc(f.label)}</label><select id="mf-${f.id}">${f.options.map(o=>`<option value="${esc(o)}" ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
      return `<label>${esc(f.label)}</label><input id="mf-${f.id}" value="${esc(f.value||'')}">`;}).join('');
    m.innerHTML=`<div class="mbox ${danger?'danger':''}" role="dialog" aria-modal="true">
      <h3>${title}</h3><div class="mb">${body}</div>${fhtml}
      <div class="mf">${cancel!==null?`<button class="btn ghost" data-m="c">${esc(cancel)}</button>`:''}
      <button class="btn ${danger?'':'dark'}" data-m="ok">${esc(ok)}</button></div></div>`;
    document.body.appendChild(m);
    const done=v=>{m.remove();document.removeEventListener('keydown',onk);res(v);};
    const onk=e=>{if(e.key==='Escape')done(null);};
    document.addEventListener('keydown',onk);
    m.addEventListener('click',e=>{if(e.target===m)done(null);});
    m.querySelector('[data-m="ok"]').onclick=()=>{
      if(fields){const out={};let bad=false;
        fields.forEach(f=>{const v=m.querySelector('#mf-'+f.id).value.trim();out[f.id]=v;
          if(f.required&&!v)bad=true; if(f.email&&!v.includes('@'))bad=true;});
        if(bad){toast('Bitte alle Pflichtfelder korrekt ausfüllen.');return;}
        done(out);}else done(true);};
    const c=m.querySelector('[data-m="c"]'); if(c)c.onclick=()=>done(null);
    const first=m.querySelector('input,textarea'); if(first)first.focus();
  });
}
function revealPw(title,cid,pw,extra=''){
  return modal({title,cancel:null,ok:'Fertig',body:`${extra}
    <div class="pwbox"><span>ID&nbsp;&nbsp;<b>${esc(cid)}</b></span></div>
    <div class="pwbox"><span id="pwval">${esc(pw)}</span>
    <button class="btn ghost sm" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('pwval').textContent).then(()=>toast('Kopiert'))">Kopieren</button></div>`});
}

async function unlock(){ const cand=$('#key').value.trim(); const prev=KEY; KEY=cand;
  const r=await api('/api/clients'); if(!r.ok){KEY=prev;$('#gateErr').textContent='Schlüssel nicht akzeptiert.';return;}
  sessionStorage.setItem('an_staff_key',KEY); enter(); }
async function boot(){ if(!KEY)return; const r=await api('/api/clients'); if(r.ok){ALL_CLIENTS=r.body.clients;enter();} }
function logout(){ sessionStorage.removeItem('an_staff_key'); location.reload(); }
async function enter(){ $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
  api('/api/build').then(r=>{ if(r.ok)$('#vchip').textContent=r.body.label; });
  go('cockpit'); }
async function checkUpdate(btn){ btn.disabled=true;
  const r=await api('/api/update',{method:'POST'}); btn.disabled=false;
  if(!r.ok){fail(r,'Update-Prüfung fehlgeschlagen');return;}
  toast(r.body.message||'');
  if(r.body.updated){ setTimeout(()=>location.reload(), 9000); } }

async function loadClients(){ const r=await api('/api/clients'); if(r.ok)ALL_CLIENTS=r.body.clients; return ALL_CLIENTS; }
async function loadBookings(){ const r=await api('/api/bookings'); if(r.ok)ALL_BOOKINGS=r.body.bookings||[]; return ALL_BOOKINGS; }
async function loadPackages(){ if(PACKAGES.length)return PACKAGES;
  const r=await api('/api/dashboard'); if(r.ok)PACKAGES=r.body.packages||[]; return PACKAGES; }

function go(v){ VIEW=v;
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#hdrop').classList.add('hidden');
  ({cockpit:showCockpit,journey:showJourney,finanzen:showFinanzen,plan:showPlan,kunden:showKunden,
    termine:showTermine,stamm:showStammdaten,outbox:showOutbox,system:showSystem}[v]||showCockpit)();
}

/* ───────── global search → jump + flash ───────── */
async function gSearch(q){
  q=(q||'').toLowerCase().trim(); const box=$('#ghits');
  if(!q){box.classList.add('hidden');return;}
  if(!ALL_CLIENTS.length)await loadClients();
  if(!ALL_BOOKINGS.length)await loadBookings();
  const hits=[];
  ALL_CLIENTS.filter(c=>[c.name,c.client_id,c.email,c.phone,c.city].some(v=>(v||'').toLowerCase().includes(q)))
    .slice(0,6).forEach(c=>hits.push({k:'Kundin · '+stageDe(c.stage),label:c.name+' ('+c.client_id+')',go:()=>pmGo('kunden',c.client_id)}));
  ALL_BOOKINGS.filter(b=>b.status==='confirmed'&&[b.name,b.email].some(v=>(v||'').toLowerCase().includes(q)))
    .slice(0,4).forEach(b=>hits.push({k:'Termin',label:b.name+' · '+dt(b.start_utc),go:()=>go('termine')}));
  box.innerHTML=hits.length?hits.map((h,i)=>`<div class="hit" data-hit="${i}"><span>${esc(h.label)}</span><span class="k">${esc(h.k)}</span></div>`).join('')
    :'<div class="hit"><span class="muted">Keine Treffer.</span></div>';
  box.classList.remove('hidden');
  hits.forEach((h,i)=>{ box.querySelector(`[data-hit="${i}"]`).onclick=()=>{box.classList.add('hidden');$('#gsearch').value='';h.go();}; });
}
async function pmGo(view,cid){
  if(view==='journey'){ await showJourneyThen(cid); }
  else{ VIEW='kunden'; $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v==='kunden'));
    await showKunden(); openClient(cid,true); }
}
function flash(el){ if(!el)return; el.scrollIntoView({block:'center'}); el.classList.remove('pm-flash'); void el.offsetWidth; el.classList.add('pm-flash'); }

/* ───────── COCKPIT ───────── */
async function showCockpit(){
  const [d,f,al]=await Promise.all([api('/api/dashboard'),api('/api/finanzen'),api('/api/alerts')]);
  if(!d.ok){fail(d,'Dashboard nicht verfügbar');return;}
  const db=d.body, fin=f.ok?f.body:null, fun=db.funnel, rev=db.revenue;
  PACKAGES=db.packages||PACKAGES;
  let h='<div id="sec-alerts"></div><h1>Cockpit</h1>';
  const quote=fin?Math.min(100,Math.round(fin.ziel.quote)):0;
  h+=`<div class="hero">
    <div class="htile hi"><div class="donutwrap">
      <div class="donut" style="background:conic-gradient(var(--clay) ${quote*3.6}deg, var(--sage-soft) 0)"><i class="num">${quote}%</i></div>
      <div><div class="v num">${eur(fin?fin.ziel.erreicht:rev.total)}</div><div class="l">Umsatz ${fin?fin.jahr:''} · Ziel ${eur(fin?fin.ziel.jahresumsatz:0)}</div></div>
    </div></div>
    <div class="htile"><div class="v num">${eur(rev.open_pipeline)}</div><div class="l">Offene Forderungen / Pipeline</div><div class="s">gewonnen, noch nicht abgeschlossen</div></div>
    <div class="htile"><div class="v num">${fun.bookings}</div><div class="l">Buchungen gesamt</div><div class="s">${fun.call_rate} % führen zum Gespräch</div></div>
    <div class="htile"><div class="v num">${fun.win_rate} %</div><div class="l">Konversion Gespräch → Kundin</div><div class="s">${fun.won} gewonnen · ${fun.delivered} geliefert</div></div>
    <div class="htile"><div class="v num">${fin?fin.breakeven.kunden_pro_monat:'—'}</div><div class="l">Break-even Kundinnen / Monat</div><div class="s">${fin?('≈ '+fin.breakeven.buchungen_pro_monat+' Buchungen nötig'):''}</div></div>
  </div>`;
  // rankings + termine
  h+='<div class="cols2" style="margin-top:20px"><div><h2>Umsatz nach Paket</h2><div class="card"><div class="rank">';
  const pk=fin?fin.ist_umsatz.nach_paket:{};
  const names=Object.fromEntries((PACKAGES||[]).map(p=>[p.key,p.name]));
  const entries=Object.entries(pk).sort((a,b)=>b[1]-a[1]);
  h+=entries.length?entries.map(([k,v],i)=>`<span class="i num">${i+1<10?'0':''}${i+1}</span><span>${esc(names[k]||k)}</span><b class="num">${eur(v)}</b>`).join('')
    :'<span></span><span class="muted">Noch kein Umsatz erfasst.</span><span></span>';
  h+='</div></div>';
  h+='<h2>Klienten nach Phase</h2><div class="card">';
  const stg=db.stages||{}; const mx=Math.max(1,...Object.values(stg));
  h+=STAGES.filter(s=>stg[s]).map(s=>`<div class="frow"><span>${stageDe(s)}</span><div class="fbar"><i style="width:${Math.round(stg[s]/mx*100)}%"></i></div><span class="fv num">${stg[s]}</span></div>`).join('')||'<span class="muted">—</span>';
  h+='</div></div><div>';
  h+='<h2>Nächste Termine</h2><div class="card">';
  h+=(db.upcoming||[]).map(b=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0">
      <span><b>${dt(b.start_utc)}</b> · ${esc(b.name)}</span><span class="muted">${esc(b.language||'')}</span></div>`).join('')||'<span class="muted">Keine anstehenden Termine.</span>';
  h+='</div>';
  if(fin){ h+='<h2>Szenarien '+fin.jahr+'</h2><div class="card tscroll"><table class="fin"><tr><th>Szenario</th><th>Umsatz</th><th>nach Steuern</th></tr>';
    h+=fin.szenarien.map(s=>`<tr><td>${esc(s.szenario)}</td><td class="num">${eur(s.umsatz)}</td><td class="num ${s.nach_steuern<0?'neg':''}">${eur(s.nach_steuern)}</td></tr>`).join('');
    h+='</table></div>'; }
  h+='</div></div>';
  $('#view').innerHTML=h;
  renderAlerts(al.ok?al.body.alerts:[]);
}
function renderAlerts(alerts){
  const box=$('#sec-alerts'); if(!box)return;
  box.innerHTML=(alerts||[]).map(a=>`<div class="alert ${a.level}">
    <div class="t">${esc(a.title)}</div><div class="s">${esc(a.subtitle)}</div>
    ${a.items.map(it=>`<div class="it"><span>${esc(it.label)}</span>${it.id?`<span class="go" onclick="pmGo('journey','${esc(it.id)}')">Anzeigen →</span>`:''}</div>`).join('')}
  </div>`).join('');
}

/* ───────── CUSTOMER JOURNEY (Paramur stage cards) ───────── */
const CJ_STAGES=[
  {num:'01',title:'Offene Anfragen',stages:['lead']},
  {num:'02',title:'Erstgespräch',stages:['call']},
  {num:'03',title:'Gewonnen & Zugang',stages:['won','invited']},
  {num:'04',title:'Intake & Vorbereitung',stages:['intake','prep']},
  {num:'05',title:'Bericht',stages:['draft','review']},
  {num:'06',title:'Geliefert & Zahlung',stages:['sent']},
  {num:'07',title:'Abgeschlossen',stages:['done']},
  {num:'⌀',title:'Storniert / Verloren',stages:['lost']},
];
function _cjActions(c){
  const cid=esc(c.client_id);
  const A=(fn,label,cls='ghost')=>`<button class="btn ${cls} sm" onclick="${fn}">${label}</button>`;
  const open=A(`openClient('${cid}')`,'Öffnen');
  switch(c.stage){
    case 'lead':   return A(`advance('${cid}','call')`,'☎ Gespräch geführt','')+open+A(`advance('${cid}','lost')`,'Verloren');
    case 'call':   return A(`advance('${cid}','won')`,'🎉 Gewonnen','ok')+open+A(`advance('${cid}','lost')`,'Verloren');
    case 'won':    return A(`sendCreds('${cid}')`,'🔑 Zugangsdaten senden','')+open;
    case 'invited':return open+A(`sendCreds('${cid}')`,'🔑 erneut senden');
    case 'intake': case 'prep': return open;
    case 'draft': case 'review': return A(`openClient('${cid}')`,'Bericht öffnen','dark');
    case 'sent':   return A(`markPaid('${cid}')`,'💶 Bezahlt','ok')+open;
    case 'done':   return open;
    case 'lost':   return A(`advance('${cid}','lead')`,'Wiederherstellen')+open;
  }
  return open;
}
function _cjRow(c){
  const stale=c.updated && (Date.now()-new Date(c.updated))/864e5>7 && !['done','lost'].includes(c.stage);
  const facts=[];
  if(c.package)facts.push(`<b>${esc(c.package_name||c.package)}</b> · <span class="num">${eur(c.price)}</span>${c.paid?' ✓ bezahlt':''}`);
  if(c.booking_slot&&['lead','call'].includes(c.stage))facts.push('Call: '+dt(c.booking_slot));
  if(c.has_pre_intake)facts.push('📋 Vorab-Angaben');
  return `<div class="cj-item" id="cj-item-${esc(c.client_id)}" data-num="${esc(c.client_id)}">
    <div class="cj-id"><div class="nm">${esc(c.name)}</div><div class="id">${esc(c.client_id)}</div></div>
    <div class="cj-mid"><span class="pill ${stageCls(c.stage)}">${stageDe(c.stage)}</span>${facts.join(' · ')||'<span class="muted">—</span>'}</div>
    <div class="cj-date"><span class="${stale?'warn':''}">${days(c.updated)}</span></div>
    <div class="cj-act">${_cjActions(c)}</div></div>`;
}
async function showJourney(){ await showJourneyThen(null); }
async function showJourneyThen(focusCid){
  await loadClients();
  let h='<h1>Customer Journey</h1><p class="muted" style="margin:4px 0 16px">Vom ersten Klick bis zum abgeschlossenen Programm — jede Karte ist eine Phase.</p>';
  for(const st of CJ_STAGES){
    const cs=ALL_CLIENTS.filter(c=>st.stages.includes(c.stage));
    if(st.stages[0]==='lost'&&!cs.length)continue;
    const openAttr=(cs.length&&st.stages[0]!=='lost')||((focusCid)&&cs.some(c=>c.client_id===focusCid))?'open':'';
    h+=`<details class="cj-stage" ${openAttr}><summary><span class="cj-num num">${st.num}</span><span class="cj-title">${st.title}</span><span class="cj-count num">${cs.length}</span></summary>`;
    h+=cs.map(_cjRow).join('')||'<div class="cj-item"><div class="muted">Keine Einträge.</div></div>';
    h+='</details>';
  }
  $('#view').innerHTML=h;
  if(focusCid){ const el=document.getElementById('cj-item-'+focusCid);
    if(el){ el.closest('details').open=true; setTimeout(()=>flash(el),80); } }
}
async function advance(cid,stage){
  const r=await api('/api/client/'+cid+'/stage',{method:'POST',body:JSON.stringify({stage})});
  if(!r.ok){fail(r,'Phasen-Wechsel fehlgeschlagen');return;}
  toast('→ '+stageDe(stage));
  if(stage==='won' && await modal({title:'Gewonnen! 🎉',body:'Die Kundin ist an Bord. Jetzt die Zugangsdaten-Karte per E-Mail senden?',ok:'🔑 Zugangsdaten senden',cancel:'Später'}))await sendCreds(cid,true);
  VIEW==='journey'?showJourneyThen(cid):openClient(cid);
}
async function markPaid(cid){
  const r=await api('/api/client/'+cid+'/profile',{method:'POST',body:JSON.stringify({paid:true})});
  if(!r.ok){fail(r,'Fehlgeschlagen');return;}
  await api('/api/client/'+cid+'/stage',{method:'POST',body:JSON.stringify({stage:'done'})});
  toast('💶 Bezahlt & abgeschlossen'); showJourneyThen(cid);
}

/* ───────── FINANZEN ───────── */
async function showFinanzen(){
  const r=await api('/api/finanzen'); if(!r.ok){fail(r,'Finanzen nicht verfügbar');return;}
  const f=r.body;
  let h=`<h1>Finanzen ${f.jahr}</h1><p class="muted" style="margin:4px 0 10px">Plan aus den Plandaten · Ist aus gewonnenen Paketen · Kosten als Plan-Näherung.</p>`;
  h+=`<h2>GuV — Gewinn- und Verlustrechnung</h2><div class="tscroll"><table class="fin"><tr><th style="width:40%">Position</th><th>Plan ${f.jahr}</th><th>Ist (${f.monate_vergangen} Mon.)</th></tr>`;
  h+=f.guv.map(g=>`<tr class="${g.strong?'strong':''}"><td>${esc(g.pos)}${g.note?` <span class="muted">(${esc(g.note)})</span>`:''}</td>
    <td class="num ${g.plan<0?'neg':''}">${eur2(g.plan)}</td><td class="num ${g.ist<0?'neg':''}">${eur2(g.ist)}</td></tr>`).join('');
  h+='</table></div>';
  h+=`<h2>Cashflow — 12 Monate</h2><div class="tscroll"><table class="fin"><tr><th>Monat</th><th>Einzahlungen</th><th>Auszahlungen</th><th>IVA</th><th>Netto</th><th>kumuliert</th></tr>`;
  h+=f.cashflow.map(c=>`<tr class="${c.typ==='plan'?'plan':''}"><td>${esc(c.monat)} ${c.typ==='plan'?'· Plan':''}</td>
    <td class="num">${eur2(c.einzahlungen)}</td><td class="num neg">−${eur2(c.auszahlungen)}</td>
    <td class="num neg">−${eur2(c.iva)}</td><td class="num ${c.netto<0?'neg':''}">${eur2(c.netto)}</td>
    <td class="num ${c.kumuliert<0?'neg':''}">${eur2(c.kumuliert)}</td></tr>`).join('');
  h+='</table></div>';
  h+=`<div class="cols2"><div><h2>Bilanz (vereinfacht) · ${esc(f.bilanz.stichtag)}</h2><div class="tscroll"><table class="fin"><tr><th>Aktiva</th><th></th></tr>`;
  h+=f.bilanz.aktiva.map(b=>`<tr class="${b.strong?'strong':''}"><td>${esc(b.pos)}</td><td class="num ${b.wert<0?'neg':''}">${eur2(b.wert)}</td></tr>`).join('');
  h+=`<tr><th>Passiva</th><th></th></tr>`;
  h+=f.bilanz.passiva.map(b=>`<tr class="${b.strong?'strong':''}"><td>${esc(b.pos)}</td><td class="num ${b.wert<0?'neg':''}">${eur2(b.wert)}</td></tr>`).join('');
  h+=`</table></div><div class="finnote">${esc(f.bilanz.hinweis)}</div></div>`;

async function setStage(cid,stage){
  const r=await api('/api/client/'+cid+'/stage',{method:'POST',body:JSON.stringify({stage})});
  if(!r.ok){fail(r,'Phasen-Wechsel fehlgeschlagen');return;}

  await loadClients(); renderKTable(); openClient(cid,true);
}
async function saveProfile(cid){
  const body={}; $$('[data-cp]').forEach(i=>body[i.dataset.cp]=i.value.trim());
  body.package=$('#pkgSel').value;
  const pr=parseFloat(($('#pkgPrice').value||'').replace(',','.')); if(!isNaN(pr))body.price=pr;
  body.paid=$('#paidChk').checked;
  const r=await api('/api/client/'+cid+'/profile',{method:'POST',body:JSON.stringify(body)});
  if(!r.ok){fail(r,'Speichern fehlgeschlagen');return;}
  toast('Gespeichert'); await loadClients(); renderKTable(); openClient(cid,true);
}
async function sendCreds(cid,quiet){
  if(!quiet && !await modal({title:'🔑 Zugangsdaten senden',body:'Erzeugt ein neues Passwort und sendet/entwirft die Zugangsdaten-Karte per E-Mail.',ok:'Senden'}))return;
  const r=await api('/api/client/'+cid+'/credentials',{method:'POST'});
  if(!r.ok){fail(r,'Zugangsdaten fehlgeschlagen');return;}
  const dv=r.body.delivery||{};
  toast('Zugang erstellt · Mail: '+(dv.draft||dv.mode||'gespeichert'));
  if(dv.mode==='off')await revealPw('Zugangsdaten (E-Mail-Versand ist aus)',cid,r.body.password,'Zur manuellen Weitergabe — einmalig sichtbar:');

}

  const ap = approved!=null ? approved : (($('#approve')||{}).checked||false);
  const r=await api('/api/client/'+cid+'/report/save',{method:'POST',body:JSON.stringify({sections:secs,approved:ap})});
  r.ok ? (toast(ap?'Gespeichert & freigegeben':'Änderungen gespeichert'), reportDirty=false) : fail(r,'Bericht konnte nicht gespeichert werden');
  return r; }
async function generate(cid){
  const ap = (($('#approve')||{}).checked||false);
  const sr=await saveReport(cid,ap);
  if(!sr.ok){return;}
  if(!ap){toast('Bitte zuerst freigeben');return;}
  toast('PDF wird erzeugt + Mail entworfen…');
  const r=await api('/api/client/'+cid+'/generate',{method:'POST'});
  if(!r.ok){fail(r,'Erzeugen fehlgeschlagen');return;}
  const dv=r.body.delivery||{};
  toast('Bericht erzeugt · '+(dv.draft||dv.mode||'gespeichert'));
  openClient(cid,true); }
async function preview(cid){
  const secs=[...$$('[data-si]')].map(t=>({key:t.getAttribute('data-key'),title:t.getAttribute('data-title'),body:t.value}));
  const r=await fetch('/api/client/'+cid+'/preview',{method:'POST',headers:{'Content-Type':'application/json','X-Auralis-Key':KEY},body:JSON.stringify({sections:secs})});
  if(!r.ok){toast('Vorschau fehlgeschlagen');return;}
  const w=window.open('','_blank'); w.document.write(await r.text()); w.document.close();
}
function saveBlob(b,name){ const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000); }
async function dl(e,cid){ e.preventDefault();
  const r=await fetch('/api/client/'+cid+'/report.pdf',{headers:{'X-Auralis-Key':KEY}});
  if(!r.ok){toast('Berichtsdatei nicht gefunden');return;}
  saveBlob(await r.blob(),'Auralis-Report-'+cid+'.pdf'); }
async function gdprExport(cid){ const r=await api('/api/client/'+cid+'/gdpr-export');
  if(!r.ok){fail(r,'Export fehlgeschlagen');return;}
  saveBlob(new Blob([JSON.stringify(r.body,null,2)],{type:'application/json'}), cid+'-gdpr-export.json'); }
async function erase(cid){ if(!await modal({title:'Unwiderruflich löschen?',danger:true,ok:'Endgültig löschen',body:'ALLE Daten von <b>'+esc(cid)+'</b> werden gelöscht: Intake, Notizen, Bericht, E-Mails, Zugang. Das ist die DSGVO-Löschung und kann nicht rückgängig gemacht werden.'}))return;
  const r=await api('/api/client/'+cid,{method:'DELETE'}); if(r.ok){toast('Gelöscht');CUR=null;$('#kdetail')&&($('#kdetail').innerHTML='');loadClients().then(renderKTable);}else fail(r,'Löschen fehlgeschlagen'); }

/* ───────── TERMINE ───────── */
async function showTermine(){
  const [av,bk]=await Promise.all([api('/api/availability'),api('/api/bookings')]);
  if(!av.ok){fail(av,'Verfügbarkeit nicht ladbar');return;}
  ALL_BOOKINGS=(bk.ok&&bk.body.bookings)||[];
  const a=av.body, days_=['mon','tue','wed','thu','fri','sat','sun'],
        names={mon:'Montag',tue:'Dienstag',wed:'Mittwoch',thu:'Donnerstag',fri:'Freitag',sat:'Samstag',sun:'Sonntag'};
  let h=`<h1>Termine</h1><div class="muted">Buchungsseite: <a href="/book" target="_blank">/book</a> · Zeiten in ${esc(a.timezone)}</div>`;
  h+=`<h2>Verfügbarkeit</h2><div class="card">`;
  h+=days_.map(d=>`<div class="kv"><span class="k">${names[d]}</span>
      <input data-av="${d}" value="${esc((a.windows[d]||[]).join(', '))}" placeholder="z. B. 09:30-12:00, 14:00-17:00"></div>`).join('');
  h+=`<div class="kv"><span class="k">Slot (min)</span><input data-avn="slot_minutes" class="num" value="${a.slot_minutes}"></div>
      <div class="kv"><span class="k">Puffer (min)</span><input data-avn="buffer_minutes" class="num" value="${a.buffer_minutes}"></div>
      <div class="kv"><span class="k">Vorlauf (h)</span><input data-avn="lead_hours" class="num" value="${a.lead_hours}"></div>
      <div class="kv"><span class="k">Horizont (Tage)</span><input data-avn="horizon_days" class="num" value="${a.horizon_days}"></div>
      <div class="kv"><span class="k">Max/Tag</span><input data-avn="max_per_day" class="num" value="${a.max_per_day}"></div>
      <div class="kv"><span class="k">Blockierte Tage</span><input data-avs="blocked_dates" value="${esc((a.blocked_dates||[]).join(', '))}" placeholder="2026-08-15, 2026-08-16"></div>
      <div style="margin-top:10px"><button class="btn dark sm" onclick="saveAvailability()">Verfügbarkeit speichern</button></div></div>`;
  h+=`<h2>Gebuchte Termine</h2>`;
  h+= ALL_BOOKINGS.length ? `<div class="card">`+ALL_BOOKINGS.map(b=>{
      const when=new Date(b.start_utc).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:a.timezone});
      return `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0">
        <span><b>${esc(when)}</b> · ${esc(b.name)} <span class="muted">${esc(b.email)} · ${esc(b.language)}${b.profile&&(b.profile.symptoms||[]).length?' · 📋 '+b.profile.symptoms.length+' Themen':''}</span>${b.note?('<br><span class="muted">„'+esc(b.note)+'“</span>'):''}</span>
        <span>${b.status==='confirmed'?`<button class="btn ghost sm" onclick="cancelBooking('${esc(b.id)}')">Stornieren</button>`:`<span class="pill">${esc(b.status)}</span>`}</span></div>`;
    }).join('')+`</div>` : `<p class="muted">Noch keine Buchungen.</p>`;
  $('#view').innerHTML=h;
}
async function saveAvailability(){
  const windows={}; $$('[data-av]').forEach(i=>{windows[i.dataset.av]=i.value.split(',').map(x=>x.trim()).filter(Boolean);});
  const body={windows};
  $$('[data-avn]').forEach(i=>{body[i.dataset.avn]=parseInt(i.value)||0;});
  const bd=$('[data-avs="blocked_dates"]'); if(bd)body.blocked_dates=bd.value.split(',').map(x=>x.trim()).filter(Boolean);
  const r=await api('/api/availability',{method:'POST',body:JSON.stringify(body)});
  r.ok?toast('Verfügbarkeit gespeichert'):fail(r,'Speichern fehlgeschlagen');
}
async function cancelBooking(id){ if(!await modal({title:'Termin stornieren?',danger:true,ok:'Stornieren',body:'Der Slot wird wieder freigegeben.'}))return;
  const r=await api('/api/booking/'+id+'/cancel',{method:'POST'});
  r.ok?(toast('Storniert'),showTermine()):fail(r,'Stornieren fehlgeschlagen'); }

/* ───────── STAMMDATEN (⚙) ───────── */
const SD_FIELDS=[["legal_name","Firmenname"],["owner","Inhaberin"],["nif","NIF / Steuernummer"],
  ["address_lines","Adresse (Zeilen mit ; trennen)"],["email","E-Mail"],["phone","Telefon"],
  ["web","Website"],["instagram","Instagram"],["meet_link","Google-Meet-Link (für Buchungen)"],
  ["vat_rate","IVA-Satz (z. B. 0.21)"],["vat_note","IVA-Hinweis"]];
async function showStammdaten(){
  const r=await api('/api/company'); if(!r.ok){fail(r,'Stammdaten nicht ladbar');return;}
  const co=r.body;
  let h=`<h1>Stammdaten</h1><div class="muted">Erscheinen auf Berichten, E-Mails und Rechnungen.</div><div class="card" style="margin-top:12px">`;
  h+=SD_FIELDS.map(([k,label])=>{
    let v=co[k]; if(Array.isArray(v))v=v.join('; '); if(v==null)v='';
    return `<div class="kv"><span class="k">${label}</span><input data-sd="${k}" value="${esc(String(v))}"></div>`;}).join('');
  const bank=co.bank||{};
  h+=`<div class="kv"><span class="k">Bank</span><input data-sdb="name" value="${esc(bank.name||'')}"></div>
      <div class="kv"><span class="k">IBAN</span><input data-sdb="iban" value="${esc(bank.iban||'')}"></div>
      <div class="kv"><span class="k">BIC</span><input data-sdb="bic" value="${esc(bank.bic||'')}"></div>
      <div style="margin-top:10px"><button class="btn dark sm" onclick="saveStammdaten()">Stammdaten speichern</button></div></div>`;
  $('#view').innerHTML=h;
}
async function saveStammdaten(){
  const body={}; $$('[data-sd]').forEach(i=>{ let v=i.value.trim();
    if(i.dataset.sd==='address_lines')v=v.split(';').map(x=>x.trim()).filter(Boolean);
    if(i.dataset.sd==='vat_rate')v=parseFloat(v)||0;
    body[i.dataset.sd]=v; });
  const bank={}; $$('[data-sdb]').forEach(i=>bank[i.dataset.sdb]=i.value.trim());
  bank.account_holder='Desiree Gruber'; body.bank=bank;
  const r=await api('/api/company',{method:'POST',body:JSON.stringify(body)});
  r.ok?toast('Stammdaten gespeichert'):fail(r,'Speichern fehlgeschlagen');
}

/* ───────── OUTBOX (⚙) ───────── */
async function showOutbox(){
  const r=await api('/api/outbox'); if(!r.ok){fail(r,'Outbox nicht ladbar');return;}
  const items=r.body.items||[];
  let h=`<h1>Outbox &amp; Dokumente</h1><div class="muted">Alle erzeugten E-Mails (.eml), Berichte und Kalender-Einladungen — dein Audit-Trail.</div>`;
  const KIND={eml:'E-Mail',pdf:'Bericht (PDF)',html:'Bericht (HTML)',ics:'Kalender'};
  h+= items.length ? `<table class="pt" style="margin-top:12px"><tr class="hd"><th>Datei</th><th>Typ</th><th>Größe</th><th>Erzeugt</th><th></th></tr>`+
    items.map(i=>`<tr><td data-l="Datei">${esc(i.file)}</td><td data-l="Typ">${esc(KIND[i.kind]||i.kind)}</td><td class="num" data-l="Größe">${(i.size/1024).toFixed(1).replace('.',',')} kB</td>
      <td class="num" data-l="Erzeugt">${esc(i.mtime.replace('T',' '))}</td>
      <td class="acts" style="text-align:right"><button class="btn ghost sm" onclick="dlOutbox('${esc(i.file)}')">↓ Herunterladen</button></td></tr>`).join('')+'</table>'
    : '<p class="muted" style="margin-top:12px">Noch keine Dokumente erzeugt.</p>';
  $('#view').innerHTML=h;
}
async function dlOutbox(f){
  const r=await fetch('/api/outbox/'+encodeURIComponent(f).replace(/%2F/g,'/'),{headers:{'X-Auralis-Key':KEY}});
  if(!r.ok){toast('Download fehlgeschlagen');return;}
  saveBlob(await r.blob(), f.split('/').pop());
}

/* ───────── SYSTEM (⚙) ───────── */
async function showSystem(){
  const r=await api('/api/status'); if(!r.ok){fail(r,'Status nicht verfügbar');return;}
  const s=r.body; const yn=v=>v?'✓ ja':'— nein';
  let h=`<h1>System</h1><div class="card" style="margin-top:12px">`;
  h+=[['Server',s.server],['Agent',s.agent_provider+' (Claude CLI: '+yn(s.claude_cli_available)+')'],
      ['E-Mail-Modus',s.email_mode+' (SMTP: '+yn(s.smtp_configured)+')'],
      ['PDF-Renderer (Chrome)',yn(s.chrome_available)],['Backups',yn(s.backup_dir_set)],
      ['Produktionsmodus',yn(s.production)],['Buchungslink',s.booking_url||'—']]
    .map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span>${esc(String(v))}</span></div>`).join('');
  h+='</div>';
  $('#view').innerHTML=h;
}
boot();
</script>
